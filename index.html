<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotoba – learn Japanese</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#17203a;--mut:#667089;--pri:#3b4cca;--pri2:#2b3aa8;--ok:#1fa971;--okbg:#d9f5e8;--bad:#e5484d;--badbg:#fde3e4;--line:#d5dbe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#1a2140;--ink:#eef1fb;--mut:#9aa4c4;--pri:#6676f0;--pri2:#4b5ad6;--okbg:#123a2c;--badbg:#44181b;--line:#2c3558;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#1a2140;--ink:#eef1fb;--mut:#9aa4c4;--pri:#6676f0;--pri2:#4b5ad6;--okbg:#123a2c;--badbg:#44181b;--line:#2c3558;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-weight:500}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 140px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.main{width:100%;background:var(--pri);color:var(--onpri,#fff);border:0;border-bottom:4px solid var(--pri2);border-radius:14px;padding:14px 20px;font-weight:900;font-size:17px}
.main.bad{background:var(--bad);border-bottom-color:#b3262b}.main.good{background:var(--ok);border-bottom-color:#14784f}
.main:active{transform:translateY(2px);border-bottom-width:2px}
.alt{width:100%;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px;font-weight:700;margin-top:26px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:26px;font-weight:900;color:var(--pri)}
.stat{font-weight:700;font-size:14px;color:var(--mut);text-align:right}
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:900;font-size:18px;border:0}
.av.l{width:84px;height:84px;min-width:84px;flex-shrink:0;font-size:38px}
.seg{display:flex;gap:6px;margin:16px 0;overflow-x:auto}
.seg button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.goal{margin:6px 0 24px;display:flex;flex-direction:column;gap:6px}
.goal small{color:var(--mut);font-weight:700}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.path{display:flex;flex-direction:column;align-items:center;gap:20px}
.node{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.node .c{width:86px;height:86px;border-radius:50%;background:var(--pri);color:var(--onpri,#fff);font-size:38px;font-weight:900;display:grid;place-items:center;border-bottom:6px solid var(--pri2)}
.node:active .c{transform:translateY(3px);border-bottom-width:3px}
.node.lock{cursor:default}.node.lock .c{background:var(--line);border-color:transparent;color:var(--mut)}
.node em{font-style:normal;font-weight:700}
.node small{color:#e9a400;letter-spacing:2px;font-size:14px}
.top{display:flex;align-items:center;gap:14px}
.x{background:none;border:0;font-size:22px;color:var(--mut);padding:4px 8px}
.les{text-align:center;padding-top:30px}
.sub{color:var(--mut);font-weight:700;margin:0}
.big{font-size:88px;font-weight:900;line-height:1.15;margin:12px 0}
.rom{font-size:26px;font-weight:700;margin:0}
.spk{background:none;border:2px solid var(--line);border-radius:20px;padding:6px 16px;font-weight:700;color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:16px 8px;font-size:22px;font-weight:700}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
input.t{width:100%;font:inherit;font-size:24px;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:22px}
.msg{margin-top:22px;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;animation:pop .25s}
.msg b{font-size:26px}.msg span{font-size:18px;font-weight:700}
.msg.g{background:var(--okbg);color:var(--ok)}.msg.b{background:var(--badbg);color:var(--bad)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
#fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
#fb.g{background:var(--okbg)}#fb.b{background:var(--badbg)}
.fb{max-width:480px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px;font-weight:700;color:var(--mut)}
nav button.on{color:var(--pri)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.res div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.res b{display:block;font-size:26px;color:var(--pri)}.res small{color:var(--mut);font-weight:700}
.pc{display:flex;align-items:center;gap:14px;margin-top:18px}
.pc input.t{margin:0;text-align:left;font-size:20px}
.sw{display:flex;gap:10px;margin-top:14px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}
.row button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}
.row button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.hd{margin:22px 0 0;color:var(--mut);font-weight:700}
.note{color:var(--mut);font-size:14px;margin:8px 2px 0}
.sa{min-height:64px;border-bottom:2px solid var(--line);margin:18px 0;display:flex;flex-wrap:wrap;justify-content:center}.sb{display:flex;flex-wrap:wrap;justify-content:center}
.tile{margin:5px;padding:10px 14px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;font-size:22px;font-weight:700}.tile small{display:block;font-size:11px;color:var(--mut)}
.hero{display:flex;gap:14px;align-items:center;margin-top:18px}.hw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.hw .bar{flex:none}.hw input.t{margin:0;text-align:left;font-size:20px;padding:10px 12px}.lv{font-weight:900;color:var(--pri)}.hw small{color:var(--mut);font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pr{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:10px;font-weight:700}.pr small{color:var(--mut);text-align:right}
.wk{flex-direction:row;justify-content:space-between;align-items:flex-end}.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.col{height:70px;width:70%;max-width:26px;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.col i{display:block;width:100%;background:var(--ok)}.wd small{color:var(--mut);font-weight:700}
.bds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bd{padding:6px 12px;border-radius:20px;border:2px solid var(--line);color:var(--mut);font-weight:700;font-size:14px;opacity:.7}.bd.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:1}
.two{display:flex;gap:10px}.two>*{flex:1}
.fc{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:30px 14px;min-height:260px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.pad{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:16px;background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:2px 100%,100% 2px;background-position:center;background-repeat:no-repeat}
.gd{position:absolute;inset:0;display:grid;place-items:center;font-size:min(62vw,220px);line-height:1;font-weight:700;opacity:.14;pointer-events:none}.gd.off{visibility:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wb{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.gridc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.wu{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;text-align:left}.wu.ok{border-color:var(--ok);background:var(--okbg)}.wc{font-size:26px;font-weight:900;letter-spacing:2px;color:var(--pri);min-width:120px}.wt{display:flex;flex-direction:column}.wt small{color:var(--mut);font-weight:700}
.main.good,.main.bad{color:#fff}
#toast{position:fixed;left:16px;right:16px;bottom:100px;max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.show{opacity:1}
.row select{font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px;max-width:170px}
.r{display:block;margin-top:6px;font-weight:700}.r.ok{color:var(--ok)}.r.bad{color:var(--bad)}
</style></head>
<body><div id="app"></div>
<script>
const CAT={h:"Hiragana",t:"Katakana",k:"Kanji",w:"Words",s:"Grammar"};
const D=[
["Vowels","h","あ a,い i,う u,え e,お o"],
["K row","h","か ka,き ki,く ku,け ke,こ ko"],
["S row","h","さ sa,し shi,す su,せ se,そ so","し is read shi, not si. Japanese has no plain “si” sound."],
["T row","h","た ta,ち chi,つ tsu,て te,と to","ち is chi and つ is tsu. These two break the plain t pattern."],
["N row","h","な na,に ni,ぬ nu,ね ne,の no"],
["H row","h","は ha,ひ hi,ふ fu,へ he,ほ ho","ふ sounds between f and h: say a soft fu. は is read ha, but as the topic particle it is read wa."],
["M row","h","ま ma,み mi,む mu,め me,も mo"],
["Y row","h","や ya,ゆ yu,よ yo"],
["R row","h","ら ra,り ri,る ru,れ re,ろ ro"],
["W row and n","h","わ wa,を wo|o,ん n","を sounds like o and is only used as a particle that marks the object. ん is the one lone consonant: n."],
["Vowels","t","ア a,イ i,ウ u,エ e,オ o","Katakana is mostly used for foreign words and names. The sounds are the same as hiragana, only the shapes differ."],
["K row","t","カ ka,キ ki,ク ku,ケ ke,コ ko"],
["S row","t","サ sa,シ shi,ス su,セ se,ソ so"],
["T row","t","タ ta,チ chi,ツ tsu,テ te,ト to"],
["N row","t","ナ na,ニ ni,ヌ nu,ネ ne,ノ no"],
["Numbers 1-5","k","一 ichi|hito one,二 ni|futa two,三 san|mi three,四 shi|yon four,五 go|itsu five","Most kanji have two kinds of readings. On’yomi come from Chinese and appear in compound words. Kun’yomi are native Japanese readings. You can type either one."],
["Nature","k","日 nichi|hi sun,月 getsu|tsuki moon,火 ka|hi fire,水 sui|mizu water,木 moku|ki tree"],
["People and places","k","人 jin|hito person,口 kou|kuchi mouth,山 san|yama mountain,川 sen|kawa river,大 dai|oo big"],
["Greetings","w","こんにちは konnichiwa hello,ありがとう arigatou thank you,はい hai yes,いいえ iie no,さようなら sayounara goodbye","In こんにちは the last は is read wa, not ha. Particles often keep an old spelling."],
["Everyday","w","あか aka red,ねこ neko cat,さかな sakana fish,たこ tako octopus,いけ ike pond"],
["A is B","s","文","Japanese puts the verb last. は marks the topic and です ends a polite sentence: A は B です means A is B. Read the particle は as wa.","わたし は がくせい です|I am a student;これ は ねこ です|This is a cat;あれ は やま です|That is a mountain"],
["Questions","s","文","Add か at the end to make a question. Word order stays the same and no question mark is needed.","あなた は がくせい です か|Are you a student?;これ は みず です か|Is this water?;これ は なん です か|What is this?"],
["Objects with を","s","文","を marks the thing the action happens to (read it as o). Pattern: who は what を verb.","わたし は みず を のみます|I drink water;ねこ は さかな を たべます|The cat eats fish;わたし は ほん を よみます|I read a book"],
["Directions","k","上 jou|ue up,下 ka|shita down,中 chuu|naka middle,左 sa|hidari left,右 yuu|migi right","Many kanji have a different reading alone than inside words. Learn both: 上 is ue by itself and jou in words like 上手 (jouzu, skilled)."],
["Body","k","手 shu|te hand,目 moku|me eye,耳 ji|mimi ear,足 soku|ashi leg,力 ryoku|chikara power"],
["Time","k","今 kon|ima now,前 zen|mae before,後 go|ato after,年 nen|toshi year,時 ji|toki time"],
["People and school","w","せんせい sensei teacher,がくせい gakusei student,ともだち tomodachi friend,かぞく kazoku family,がっこう gakkou school"],
["Verbs","w","たべます tabemasu eat,のみます nomimasu drink,いきます ikimasu go,みます mimasu see,ききます kikimasu listen"],
["Days of the week","w","げつようび getsuyoubi Monday,かようび kayoubi Tuesday,すいようび suiyoubi Wednesday,もくようび mokuyoubi Thursday,きんようび kinyoubi Friday"]
];
const ALL=[];
D.forEach((d,u)=>d[1]==='s'||d[2].split(',').forEach(s=>{const a=s.trim().split(' ');ALL.push({j:a[0],r:a[1],m:a.slice(2).join(' ')||null,k:d[1],u})}));
const A=document.getElementById('app'),AV=['#3b4cca','#e5484d','#1fa971','#e9a400','#a23bca'];
const day=()=>new Date().toDateString(),yest=()=>new Date(Date.now()-864e5).toDateString(),gap=()=>S.last?Math.round((new Date(day())-new Date(S.last))/864e5):99;
const fresh=()=>({xp:0,streak:0,last:"",done:{},miss:{},today:0,day:"",name:"",av:0,sound:1,voice:1,goal:50,lessons:0,right:0,wrong:0,tab:"h",romaji:1,free:0,vname:"",rate:.8,hist:{},perfect:0,best:0,fc:"h",wc:"h",card:{},wr:{},wl:{},wm:"lesson",theme:0,mode:"auto"});
let S=fresh();
try{Object.assign(S,JSON.parse(localStorage.getItem("kotoba")||"{}"))}catch(e){}
if(S.day!==day()){S.today=0;S.day=day()}
const save=()=>{try{localStorage.setItem("kotoba",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ans=it=>it.m||it.r.split('|')[0];
const rd=it=>{const a=it.r.split('|');return it.k==='k'?`On’yomi: ${a[0]}<br>Kun’yomi: ${a[1]}`:a.join(' or ')};
const R=Object.fromEntries('わたし watashi,は wa,がくせい gakusei,です desu,これ kore,ねこ neko,あれ are,やま yama,か ka,なん nani,みず mizu,あなた anata,を o,のみます nomimasu,さかな sakana,たべます tabemasu,ほん hon,よみます yomimasu'.split(',').map(s=>s.split(' ')));
const ds=(a,c)=>shuffle([...new Set(a)].filter(x=>x!==c)).slice(0,3);
const nz=s=>s.toLowerCase().replace(/[^a-z]/g,'').replace(/shi/g,'si').replace(/chi/g,'ti').replace(/tsu/g,'tu').replace(/fu/g,'hu').replace(/ou/g,'o');
const hasJa=()=>{try{return speechSynthesis.getVoices().some(v=>v.lang.replace('_','-').startsWith('ja'))}catch(e){return false}};
function toast(m){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className=''},9000);
}
const sp=s=>{s=String(s).trim().toLowerCase();return/^[a-z]+$/.test(s)?s.replace(/shi/g,'si').replace(/chi/g,'ti').replace(/tsu/g,'tu').replace(/fu/g,'hu'):null};
const rvars=r=>[...new Set([r,r.replace(/ou/g,'o'),r.replace(/ou/g,'oo')].map(sp))];
const KR={'一':'いち','二':'に','三':'さん','四':'よん','五':'ご','日':'ひ','月':'つき','火':'ひ','水':'みず','木':'き','人':'ひと','口':'くち','山':'やま','川':'かわ','大':'だい'};
const jaVoices=()=>{try{return speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith('ja'))}catch(e){return[]}};
const vScore=v=>(/google/i.test(v.name)?5:0)+(/neural|natural|enhanced|premium|wavenet|online/i.test(v.name)?3:0)+(v.localService===false?2:0)+(/kyoko|haruka|nanami|ayumi|o-ren|sayaka|female/i.test(v.name)?1:0)-(/compact/i.test(v.name)?3:0);
const isOff=()=>typeof navigator!=='undefined'&&navigator.onLine===false;
const isLocal=v=>v.localService!==false;
function pickVoice(){let l=jaVoices();if(isOff()&&l.some(isLocal))l=l.filter(isLocal);return l.find(v=>v.name===S.vname)||[...l].sort((a,b)=>vScore(b)-vScore(a))[0]}
let vWarned=0;
function say(t,f,tried,err){
  tried=tried||[];
  if(!S.voice&&!f)return;
  if(typeof speechSynthesis==='undefined'||typeof SpeechSynthesisUtterance==='undefined'){if(f)toast('Voice is not supported in this app. Open the link in Chrome instead.');return}
  const off=isOff(),rest=jaVoices().sort((a,b)=>off?isLocal(b)-isLocal(a):0);
  const list=[pickVoice(),...rest].filter((x,i,a)=>x&&a.indexOf(x)===i);
  const v=list.find(x=>!tried.includes(x));
  if(!v&&tried.includes('d')){
    if(f||!vWarned){vWarned=1;toast((list.length?'Voice did not play'+(err&&err.error?' ('+err.error+')':''):'No Japanese voice found')+(off?'. You are offline: download the Japanese voice data while online (Settings, Text-to-speech output, Google, Install voice data, Japanese).':'. On your phone: Settings, Text-to-speech output, Google, Install voice data, Japanese. Then restart the phone.'))}
    return;
  }
  try{
    speechSynthesis.cancel();speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(KR[t]||t);u.lang='ja-JP';u.rate=S.rate||.8;u.pitch=1;u.volume=1;if(v)u.voice=v;
    let st=0;
    u.onstart=()=>{if(!st)st=1};
    u.onerror=e=>{if(st===2||(e&&(e.error==='interrupted'||e.error==='canceled')))return;st=2;if(tried.length<8)say(t,f,[...tried,v||'d'],e)};
    setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},80);
    if(v&&!isLocal(v))setTimeout(()=>{if(!st){st=2;try{speechSynthesis.cancel()}catch(e){}if(tried.length<8)say(t,f,[...tried,v],{error:'timeout'})}},4000);
  }catch(e){if(f)toast('Voice error. Try opening the link in Chrome.')}
}
let AC;
function tone(f,t,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}}
const sfx=g=>{if(!S.sound)return;g?(tone(660,0,.12),tone(880,.12,.22)):(tone(220,0,.25),tone(165,.22,.3))};
let Q,total,ok,err,cur,opts,done,unit,lim,view='home';
const avatar=(c='')=>`<span class="av ${c}" style="background:${AV[S.av]}">${esc((S.name||'K')[0].toUpperCase())}</span>`;
const nav=()=>`<nav>${[['home','Learn','home'],['cards','Cards','cards'],['wr','Write','wlist'],['jlpt','JLPT','jlpt'],['prof','Profile','prof']].map(b=>`<button class="${view==b[0]?'on':''}" onclick="${b[2]}()">${b[1]}</button>`).join('')}</nav>`;

function home(){
  view='home';
  const g=S.goal,p=Math.min(100,S.today/g*100),st=gap()<=2?S.streak:0;
  const weak=Object.keys(S.miss).filter(j=>S.miss[j]>0).length;

function jfin(){
  const pct=Math.round(jok/JL.length*100);S.jb=S.jb||{};S.jb[jm]=Math.max(S.jb[jm]||0,pct);save();sfx(1);
  A.innerHTML=`<div class="les" style="padding-top:70px"><div class="big" style="font-size:52px">${jok} / ${JL.length}</div><p class="sub">${pct}% correct</p><p class="note">This is practice, not a prediction of your real JLPT score. Review what you missed in the Cards and Learn tabs.</p></div><div id="fb"><div class="fb two"><button class="alt" style="margin:0" onclick="jstart('${jm}')">Try again</button><button class="main" onclick="jlpt()">Done</button></div></div>`;
}
function vtest(v,o){
  o.className='r';o.textContent='Trying...';
  try{
    speechSynthesis.cancel();speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance('こんにちは');u.lang='ja-JP';u.rate=.8;if(v)u.voice=v;
    let st=0;
    u.onstart=()=>{st=1;o.textContent='Playing. If you hear it, this voice works.';o.className='r ok'};
    u.onend=()=>{if(st)o.textContent='Finished. Did you hear it?'};
    u.onerror=e=>{o.textContent='FAILED: '+((e&&e.error)||'unknown');o.className='r bad'};
    setTimeout(()=>speechSynthesis.speak(u),80);
  }catch(e){o.textContent='FAILED: '+e;o.className='r bad'}
}
function vcheck(){
  view='prof';const all=jaVoices(),n=typeof speechSynthesis==='undefined'?0:speechSynthesis.getVoices().length;
  A.innerHTML=`<header><span class="logo">Voice check</span></header><p class="note">${isOff()?'You are offline.':'You are online.'} Voices on this phone: ${n}. Japanese voices: ${all.length}. Tap Play on each line and note the result.</p><div id="vl"></div><button class="alt" onclick="prof()">Back to Profile</button>${nav()}`;
  const L=document.getElementById('vl');
  [null,...all].forEach(v=>{
    const d=document.createElement('div');d.className='row';d.style.cssText='flex-direction:column;align-items:flex-start';
    const t=document.createElement('b');t.textContent=v?v.name+' ('+v.lang+', '+(isLocal(v)?'offline':'online')+')':'Default voice (the phone chooses)';
    const b=document.createElement('button');b.textContent='Play';
    const o=document.createElement('span');o.className='r';
    b.onclick=()=>vtest(v,o);d.append(t,b,o);L.append(d);
  });
}
let rc=0;
function rst(b){if(!rc){rc=1;b.textContent='Tap again to erase everything';return}rc=0;const n=S.name;S=fresh();S.name=n;save();home()}
function start(n){if(D[n][1]==='s'){const q=D[n][4].split(';').map(s=>{const[a,b]=s.split('|');return{t:'s',tiles:a.split(' '),en:b}});unit=n;lim=n;Q=[{t:'n'},...shuffle(q)];total=q.length;ok=0;err=0;return next()}run(ALL.filter(x=>x.u===n),n)}
function sdraw(){const q=cur,t=q.tiles;document.getElementById('sa').innerHTML=q.sel.map(i=>`<button class="tile" onclick="stap(${i},0)">${t[i]}</button>`).join('')||'<span class="sub" style="align-self:center">Tap the words below</span>';document.getElementById('sb').innerHTML=q.bank.filter(i=>!q.sel.includes(i)).map(i=>`<button class="tile" onclick="stap(${i},1)">${t[i]}${S.romaji?`<small>${R[t[i]]||''}</small>`:''}</button>`).join('')}
function stap(i,a){if(done)return;a?cur.sel.push(i):cur.sel=cur.sel.filter(x=>x!==i);sdraw()}
function schk(){if(done||!cur.sel.length)return;const t=cur.tiles;fb(cur.sel.map(i=>t[i]).join(' ')===t.join(' '),t.join(' '))}
function listen(){const Rc=window.SpeechRecognition||window.webkitSpeechRecognition,h=document.getElementById('heard');if(!Rc)return;try{const r=new Rc();r.lang='ja-JP';r.onresult=e=>{const t=e.results[0][0].transcript;h.textContent='Heard: '+t+(t.replace(/\s/g,'').includes(cur.it.j)?' ✓ Great!':' (try again)')};r.onerror=()=>{h.textContent='Microphone not available. Check the permission.'};h.textContent='Listening…';r.start()}catch(e){h.textContent='Microphone not available.'}}
function review(){
  const w=Object.keys(S.miss).filter(j=>S.miss[j]>0).sort((a,b)=>S.miss[b]-S.miss[a]).slice(0,5).map(j=>ALL.find(x=>x.j===j)).filter(Boolean);
  if(w.length)run(w,-1);
}
function run(items,n){
  unit=n;lim=n<0?99:n;Q=[];if(n>=0&&D[n][3])Q.push({t:'n'});
  if(n>=0)items.forEach(it=>Q.push({t:'i',it}));
  Q.push(...shuffle(items.flatMap(it=>['a','b','c'].map(t=>({t,it})))));
  total=items.length*3;ok=0;err=0;next();
}
function shell(b){A.innerHTML=`<div class="top"><button class="x" onclick="home()" aria-label="Quit lesson">✕</button><div class="bar"><i style="width:${ok/total*100}%"></i></div></div><main class="les">${b}<div id="msg" aria-live="polite"></div></main><div id="fb"></div>`}
function btn(l,f){document.getElementById('fb').innerHTML=`<div class="fb"><button class="main" onclick="${f}">${l}</button></div>`}
const spk=`<button class="spk" onclick="say(cur.it.j,1)">Hear it</button>`;
const fs=s=>s.length>3?56:88;
function next(){
  if(!Q.length)return fin();
  cur=Q[0];done=false;const q=cur,it=q.it;
  if(q.t==='n'){shell(`<p class="sub">Good to know</p><p class="big" style="font-size:22px;line-height:1.6">${D[unit][3]}</p>`);btn('Got it','nx()');return}
  if(q.t==='s'){q.bank=shuffle(q.tiles.map((_,i)=>i));q.sel=[];shell(`<p class="sub">Translate this sentence</p><p class="big" style="font-size:28px">${q.en}</p><div class="sa" id="sa"></div><div class="sb" id="sb"></div>`);btn('Check','schk()');sdraw();return}
  const pool=ALL.filter(x=>x.k===it.k&&x.u<=lim);
  if(q.t==='i'){
    shell(`<p class="sub">New ${it.k=='w'?'word':it.k=='k'?'kanji':'character'}</p><div class="big" style="font-size:${fs(it.j)}px">${it.j}</div><p class="rom">${rd(it)}</p>${it.m?`<p class="sub">${it.m}</p>`:''}${spk}`);
    btn('Got it','nx()');say(it.j);return;
  }
  if(q.t==='a'){
    const c=ans(it);opts=shuffle([c,...ds(pool.map(ans),c)]);
    shell(`<p class="sub">What is this?</p><div class="big" style="font-size:${fs(it.j)}px">${it.j}</div>${spk}<div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="choose(${i})">${o}</button>`).join('')}</div>`);
  }else if(q.t==='b'){
    const c=it.j;opts=shuffle([c,...ds(pool.map(x=>x.j),c)]);const a=ans(it);
    shell(`<p class="sub">Which one is this?</p><div class="big" style="font-size:${a.length>3?44:88}px">${a}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="choose(${i})">${o}</button>`).join('')}</div>`);
  }else{
    shell(`<p class="sub">Type the reading in English letters (romaji)</p><div class="big" style="font-size:${fs(it.j)}px">${it.j}</div>${spk}${it.k==='w'&&(window.SpeechRecognition||window.webkitSpeechRecognition)?' <button class="spk" onclick="listen()">Say it</button><p class="sub" id="heard"></p>':''}<input class="t" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" onkeydown="if(event.key==='Enter')done?nx():chk()">`);
    btn('Check','chk()');document.getElementById('inp').focus();
  }
}
function choose(i){
  if(done)return;const c=cur.t==='a'?ans(cur.it):cur.it.j;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(opts[k]===c)b.classList.add('ok');else if(k===i)b.classList.add('bad')});
  fb(opts[i]===c,c);
}
function chk(){
  if(done)return;const v=document.getElementById('inp').value;if(!v.trim())return;
  document.getElementById('inp').disabled=true;
  const it=cur.it,sv=sp(v);fb(v.trim()===it.j||(sv!==null&&it.r.split('|').some(r=>rvars(r).includes(sv))),it.r.split('|').join(' or '));
}
function fb(good,shown){
  done=true;const it=cur.it||{j:cur.tiles.join('')};
  if(good){ok++;S.right++;if(S.miss[it.j])S.miss[it.j]--}else{err++;S.wrong++;if(cur.it)S.miss[it.j]=(S.miss[it.j]||0)+1;Q.push({...cur,sel:[],bank:cur.bank&&shuffle(cur.bank)})}
  document.querySelector('.bar i').style.width=ok/total*100+'%';
  sfx(good);try{navigator.vibrate&&navigator.vibrate(good?20:[60,40,60])}catch(e){}
  const m=document.getElementById('msg');
  m.innerHTML=`<div class="msg ${good?'g':'b'}"><b>${good?'✓ Correct!':'✗ Not quite'}</b>${good&&!cur.tiles?'':`<span>${good?'':'Correct answer: '}${shown}</span>${cur.tiles?`<span>${cur.tiles.map(x=>R[x]||x).join(' ')}</span>`:''}`}</div>`;
  m.scrollIntoView({block:'nearest'});
  const f=document.getElementById('fb');f.className=good?'g':'b';
  f.innerHTML=`<div class="fb"><button class="main ${good?'good':'bad'}" onclick="nx()">Continue</button></div>`;
  setTimeout(()=>say(it.j),400);save();
}
function nx(){Q.shift();next()}
function fin(){
  const xp=10+Math.max(0,5-err)*2,a=Math.round(total/(total+err)*100);
  S.xp+=xp;S.today+=xp;S.lessons++;S.hist[day()]=(S.hist[day()]||0)+xp;if(!err)S.perfect=1;if(unit>=0)S.done[unit]=Math.min(3,(S.done[unit]||0)+1);
  S.streak=gap()===0?S.streak:(gap()<=2?S.streak+1:1);S.last=day();S.best=Math.max(S.best||0,S.streak);save();sfx(1);
  A.innerHTML=`<div class="les" style="padding-top:70px"><div class="big" style="font-size:52px">よくできました</div><p class="sub">Well done! Lesson complete.</p><div class="res"><div><b>+${xp}</b><small>XP</small></div><div><b>${a}%</b><small>Accuracy</small></div></div></div><div id="fb"><div class="fb"><button class="main" onclick="home()">Continue</button></div></div>`;
}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener("voiceschanged",()=>{if(view==="prof")prof()})}catch(e){}
applyTheme();
home();
</script></body></html>
