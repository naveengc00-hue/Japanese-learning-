    return {id:'mock-'+level+'-v-'+w.id,domain:'Vocabulary',prompt,content,correct,choices:mockOptions(correct,pool),explanation:`${esc(w.j)} (${esc(w.kana)}, ${esc(w.romaji)}) means ${esc(w.meaning)}. Example: ${esc(w.example)} — ${esc(w.translation)}`};
  });
}
function mockGrammarRows(level){
  const cat=({N5:'s',N4:'g4',N3:'g3',N2:'g2'})[level];
  return D.map((d,i)=>({d,i})).filter(x=>x.d[1]===cat&&x.d[2]==='文'&&x.d[3]&&x.d[4]);
}
function mockExtractGrammarTarget(title,jp){
  const tokens=jp.split(/\s+/).filter(Boolean);
  if(tokens.length<3)return null;
  const cleanTitle=String(title||'').replace(/^\d+(?:-\d+)?\.\s*/,'');
  const titleKana=(cleanTitle.match(/[ぁ-んァ-ヶー]+/g)||[]).filter(x=>x.length>=1&&x!=='フォーム');
  // Try multi-token or single-token matches from the grammar title inside the sentence
  for(const cand of titleKana){
    const idx=tokens.findIndex(t=>t===cand||(cand.length>=2&&t.includes(cand)));
    if(idx>=0)return {idx,token:tokens[idx]};
  }
  // Fallback: pick a meaningful non-first grammar/verb/particle token
  const common=['は','が','を','に','で','へ','と','も','の','か','から','まで','ので','のに','ても','ように','わけ','はず','べき','ため','おかげで','せいで','くせに','ながら','つもり','ばかり','ところ'];
  for(const c of common){
    const idx=tokens.indexOf(c);
    if(idx>0)return {idx,token:tokens[idx]};
  }
  return null;
}
function mockMakeGrammar(level,count){
  const rows=shuffle(mockGrammarRows(level));
  if(rows.length<count)throw new Error('Not enough '+level+' grammar lessons for this mock examination.');
  const allExamples=rows.flatMap(x=>String(x.d[4]).split(';').map(pair=>{
    const parts=pair.split('|');return {jp:(parts[0]||'').trim(),en:(parts.slice(1).join('|')||'').trim(),title:x.d[0]};
  }).filter(x=>x.jp&&x.en));
  // Build pool of grammar tokens from this level for realistic fill-in-the-blank distractors
  const levelTargets=rows.flatMap(({d})=>{
    const exs=String(d[4]).split(';').map(p=>(p.split('|')[0]||'').trim()).filter(Boolean);
    return exs.map(jp=>mockExtractGrammarTarget(d[0],jp)).filter(Boolean).map(t=>t.token);
  });
  const backupParticles=['は','が','を','に','で','へ','と','も','の','か','から','まで','ので','のに','ても'];
  return rows.slice(0,count).map(({d,i},n)=>{
    const examples=String(d[4]).split(';').map(pair=>{
      const parts=pair.split('|');return {jp:(parts[0]||'').trim(),en:(parts.slice(1).join('|')||'').trim()};
    }).filter(x=>x.jp&&x.en);
    const ex=examples[Math.floor(Math.random()*examples.length)];
    const wantBlank=(n%3!==2); // ~2/3 fill-in-the-blank, ~1/3 sentence comprehension
    const target=wantBlank?mockExtractGrammarTarget(d[0],ex.jp):null;
    if(target){
      const tokens=ex.jp.split(/\s+/).filter(Boolean);
      const blanked=tokens.map((tok,ti)=>ti===target.idx?'（　　）':tok).join(' ');
      const correct=target.token;
      const sameLenPool=levelTargets.filter(t=>t!==correct&&Math.abs(t.length-correct.length)<=3);
      const choices=mockOptions(correct,sameLenPool.length>=3?sameLenPool:levelTargets,backupParticles);
      return {
        id:'mock-'+level+'-g-'+i,domain:'Grammar',
        prompt:'Choose the best word or grammar form for the blank.',
        content:`<div class="jp" style="font-size:23px;line-height:1.8;text-align:center">${esc(blanked)}</div><p class="note" style="text-align:center">${esc(ex.en)}</p>`,
        correct,choices,
        explanation:`${esc(d[0])}: ${esc(d[3])} Full sentence: ${esc(ex.jp)} — ${esc(ex.en)}`
      };
    }
    const correct=ex.en;
    const pool=allExamples.map(x=>x.en);
    return {
      id:'mock-'+level+'-g-'+i,domain:'Grammar',
      prompt:'Choose the correct meaning of this sentence.',
      content:`<div class="jp" style="font-size:23px;line-height:1.8;text-align:center">${esc(ex.jp)}</div>`,
      correct,choices:mockOptions(correct,pool),
      explanation:`${esc(d[0])}: ${esc(d[3])} Example: ${esc(ex.jp)} — ${esc(ex.en)}`
    };
  });
}

/* Normalize answer values and validate each generated mock item before the exam starts. */
function mockAnswerKey(value){
  return String(value===undefined||value===null?'':value).normalize('NFKC').trim();
}
function mockAnswerIsCorrect(selected,correct){
  return mockAnswerKey(selected)!=='' && mockAnswerKey(selected)===mockAnswerKey(correct);
}
function mockValidateQuestionBank(sections){
  const ids=new Set();
  for(const sec of sections){
    for(const q of sec.questions){
      if(!q||!q.id||ids.has(q.id))throw new Error('Duplicate or invalid question ID in mock exam.');
      ids.add(q.id);
      if(!Array.isArray(q.choices)||q.choices.length!==4)throw new Error('A mock question does not have exactly four choices.');
      const choiceKeys=q.choices.map(mockAnswerKey);
      if(new Set(choiceKeys).size!==4)throw new Error('A mock question contains duplicate answer choices. Please regenerate the exam.');
      const correctKey=mockAnswerKey(q.correct);
      if(!correctKey||choiceKeys.filter(x=>x===correctKey).length!==1)throw new Error('A question has a missing or ambiguous correct answer. Please regenerate the exam.');
    }
  }
  return true;
}

function mockExamBuild(level){
  const vocab=mockMakeVocabulary(level);
  const gCount=({N5:24,N4:22,N3:26,N2:28})[level];
  const grammar=mockMakeGrammar(level,gCount);
  const reading=mockMakeReading(level);
  const listening=mockMakeListening(level);
  if(listening.length<8||reading.length<6)throw new Error('The reading or listening question bank is incomplete for '+level+'.');
  if(level==='N2'){
    return [{id:'knowledge-reading',name:MOCK_TIMES.N2[0][1],minutes:105,questions:shuffle([...vocab,...grammar,...reading])},
            {id:'listening',name:'Listening',minutes:50,questions:shuffle(listening)}];
  }
  const times=MOCK_TIMES[level];
  return [
    {id:'vocab',name:times[0][1],minutes:times[0][2],questions:shuffle(vocab)},
    {id:'grammar-reading',name:times[1][1],minutes:times[1][2],questions:shuffle([...grammar,...reading])},
    {id:'listening',name:'Listening',minutes:times[2][2],questions:shuffle(listening)}
  ];
}

  D.forEach((d,i)=>{if((d[1]==='s'||d[1]==='g4'||d[1]==='g3'||d[1]==='g2')&&(S.done||{})[i]>0){const level=({s:'N5',g4:'N4',g3:'N3',g2:'N2'})[d[1]],examples=(d[4]||'').split(';').slice(0,2).map(x=>{const a=x.split('|');return a.length>1?`${a[0]} — ${a[1]}`:x}).join(' · ');out.push({id:'g:'+i,type:'Grammar',level,prompt:d[0],answer:d[3]||'Review this grammar lesson.',detail:'Study the lesson pattern and when to use it.',example:examples})}});

function srsStart(){
  srsQueue=srsDueItems().map(x=>x.id);srsIndex=0;srsRevealed=false;srsSessionDone=0;
  if(!srsQueue.length){toast('No items are due right now.');srsDashboard();return}
  srsDraw();
}
function srsDraw(){
  if(srsIndex>=srsQueue.length){srsFinish();return}
  const id=srsQueue[srsIndex],item=srsSources().find(x=>x.id===id);
  if(!item){srsIndex++;srsDraw();return}
  const st=srsStore()[id]||{};
  A.innerHTML=`<header><button class="x" onclick="srsDashboard()">‹</button><span class="logo">Mixed revision</span><span class="stat">${srsIndex+1}/${srsQueue.length}</span></header>
  <section class="kanji-hub" style="margin-top:22px"><div class="row" style="justify-content:space-between"><span class="badge">${item.type}</span><span class="stat">${item.level}</span></div>
  <p class="eyebrow" style="text-align:center;margin-top:22px">RECALL THIS</p><div class="jp" style="text-align:center;font-size:${item.type==='Kanji'?'64px':'34px'};margin:24px 0">${item.prompt}</div>
  ${srsRevealed?`<div class="vocab-example"><h2 style="text-align:center">${item.answer}</h2><p class="note" style="text-align:center">${item.detail||''}</p>${item.example?`<p>${item.example}</p>`:''}</div><p class="note" style="text-align:center">How well did you remember?</p><div class="two"><button class="alt" onclick="srsRate('Again')">Again</button><button class="alt" onclick="srsRate('Hard')">Hard</button><button class="main" onclick="srsRate('Good')">Good</button><button class="main" onclick="srsRate('Easy')">Easy</button></div>`:`<button class="main" style="width:100%" onclick="srsRevealed=true;srsDraw()">Show answer</button>`}
  </section><p class="note" style="text-align:center">Again = forgot · Hard = difficult · Good = remembered · Easy = very easy</p>`;
}
function srsRate(rating){
  const id=srsQueue[srsIndex],store=srsStore(),old=store[id]||{interval:0,ease:2.5,reps:0},now=srsNow();
  let ease=old.ease||2.5,interval=old.interval||0,reps=old.reps||0;
  if(rating==='Again'){reps=0;interval=10/1440;ease=Math.max(1.3,ease-.2)}
  else if(rating==='Hard'){interval=interval?Math.max(1,interval*1.2):1;reps=Math.max(1,reps);ease=Math.max(1.3,ease-.15)}
  else if(rating==='Good'){interval=interval===0?1:interval===1?3:interval*ease;reps++}
  else{interval=interval===0?2:interval===1?5:interval*ease*1.3;reps++;ease=Math.min(3.0,ease+.15)}
  interval=Math.min(365,Math.max(10/1440,interval));
  const day=srsToday(),alreadyRewarded=old.rewardDay===day;
  store[id]={...old,due:now+interval*864e5,interval,ease,reps,last:now,lastRating:rating,rewardDay:alreadyRewarded?old.rewardDay:day};
  const hist=srsHistory();hist.push({id,rating,day,at:now});if(hist.length>1000)hist.splice(0,hist.length-1000);
  if(!alreadyRewarded){gain(2);}
  save();srsSessionDone++;srsIndex++;srsRevealed=false;srsDraw();
}
function srsFinish(){

}

    const nextSection=document.querySelector('.learning-section');

  });
}

      const data=(parsed&&parsed.app==='Kotoba'&&parsed.data&&typeof parsed.data==='object')?parsed.data:parsed;
      if(!data||typeof data!=='object'||Array.isArray(data)||typeof data.xp!=='number'){

const STROKE_CACHE_KEY='kotoba_strokes_v1';
let _strokeCacheMem=null;
function kanjiGetStrokeCache(){
  if(_strokeCacheMem)return _strokeCacheMem;
  try{_strokeCacheMem=JSON.parse(localStorage.getItem(STROKE_CACHE_KEY)||'{}')||{};}catch(e){_strokeCacheMem={};}
  return _strokeCacheMem;
}
function kanjiSaveStrokeCache(){
  try{localStorage.setItem(STROKE_CACHE_KEY,JSON.stringify(kanjiGetStrokeCache()));}catch(e){}
}
function kanjiCachedCount(list){
  const cache=kanjiGetStrokeCache();
  return (list||[]).filter(k=>cache[k.ch]&&Array.isArray(cache[k.ch].paths)&&cache[k.ch].paths.length).length;
}
async function kanjiFetchStrokeData(ch){
  const cache=kanjiGetStrokeCache();
  if(cache[ch]&&Array.isArray(cache[ch].paths)&&cache[ch].paths.length)return {cached:true,vb:cache[ch].vb||'0 0 109 109',paths:cache[ch].paths};
  const code=ch.codePointAt(0).toString(16).padStart(5,'0');
  const sources=[
    'https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/'+code+'.svg',
    'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/'+code+'.svg'
  ];
  let paths=[],vb='0 0 109 109';
  for(const url of sources){
    try{
      const response=await fetch(url,{mode:'cors',cache:'force-cache'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      const xml=new DOMParser().parseFromString(await response.text(),'image/svg+xml');
      if(xml.querySelector('parsererror'))throw new Error('Invalid SVG data');
      const root=xml.documentElement;
      if(root&&root.getAttribute('viewBox'))vb=root.getAttribute('viewBox');
      const allPaths=[...xml.getElementsByTagNameNS('http://www.w3.org/2000/svg','path')];
      paths=allPaths.filter(p=>{
        let node=p.parentElement;
        while(node&&node!==root){
          const id=node.getAttribute&&node.getAttribute('id');
          if(id&&id.includes('StrokePaths'))return true;
          node=node.parentElement;
        }
        return false;
      }).map(p=>p.getAttribute('d')).filter(Boolean);
      if(!paths.length){
        paths=[...xml.querySelectorAll('g[id*="StrokePaths"] path')].map(p=>p.getAttribute('d')).filter(Boolean);
      }
      if(paths.length)break;
    }catch(e){}
  }
  if(paths.length){
    cache[ch]={vb,paths};
    kanjiSaveStrokeCache();
    return {cached:false,vb,paths};
  }
  return null;
}
let _kanjiCaching=false;
async function kanjiCacheLevelStrokes(){
  if(_kanjiCaching)return;
  if(isOff()){toast('Connect to the internet once to save stroke animations for offline use.');return;}
  _kanjiCaching=true;
  const list=[...N5_KANJI],btn=document.getElementById('kanjiCacheBtn');
  let done=0,failed=0;
  for(const k of list){
    const res=await kanjiFetchStrokeData(k.ch);
    if(res)done++;else failed++;
    if(btn&&document.getElementById('kanjiCacheBtn')===btn){
      btn.textContent=`Saving ${kanjiLevel} strokes… (${done}/${list.length})`;
    }
  }
  _kanjiCaching=false;
  toast(failed?`Saved ${done}/${list.length} Kanji strokes (${failed} failed).`:`All ${done} ${kanjiLevel} Kanji strokes saved for offline use!`);
  if(view==='kanji')kanjiHome();
}
async function kanjiLoadStrokes(ch){
  const status=document.getElementById('kanjiStrokeStatus'),svg=document.getElementById('kanjiStrokeSvg');if(!status||!svg)return;
  kanjiStrokePaths=[];kanjiStrokeStep=0;svg.replaceChildren();
  status.textContent='Loading stroke order…';
  const data=await kanjiFetchStrokeData(ch);
  if(N5_KANJI[kanjiCurrent].ch!==ch)return;
  if(!data||!data.paths.length){
    status.textContent='Stroke order not cached yet and offline/unavailable. Connect once to cache it; writing practice still works offline.';
    const count=document.getElementById('kanjiStrokeCount');if(count)count.textContent='Stroke data unavailable';
    return;
  }
  if(data.vb)svg.setAttribute('viewBox',data.vb);
  kanjiStrokePaths=data.paths;
  kanjiStrokePaths.forEach((d,n)=>{
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke','var(--ink)');
    path.setAttribute('stroke-width','3.5');
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-linejoin','round');
    path.setAttribute('opacity','0');
    path.dataset.n=n;
    svg.appendChild(path);
  });
  status.textContent=data.cached?'Stroke order loaded from offline cache.':'Stroke order loaded & saved for offline use.';
  kanjiStrokeStep=0;kanjiStrokeRender();
}
function kanjiStrokeRender(){
  const svg=document.getElementById('kanjiStrokeSvg');if(!svg)return;

  const c=document.getElementById('kanjiStrokeCount');if(c)c.textContent=kanjiStrokePaths.length?`Stroke ${kanjiStrokeStep} of ${kanjiStrokePaths.length}`:'Stroke data unavailable';
}

function initKotobaDrawingCanvas(canvasId){
  const cv=document.getElementById(canvasId);if(!cv)return;const ctx=cv.getContext('2d');let drawing=false;
  ctx.lineWidth=34;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';
  const point=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]+.1);ctx.stroke()};
  cv.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(p[0],p[1])};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
}

  [null,...all].forEach(v=>{
    const d=document.createElement('div');d.className='row';d.style.cssText='flex-direction:column;align-items:flex-start';
    const t=document.createElement('b');t.textContent=v?v.name+' ('+v.lang+', '+(isLocal(v)?'offline':'online')+')':'Default voice (the phone chooses)';
    const b=document.createElement('button');b.textContent='Play';
    const o=document.createElement('span');o.className='r';
    b.onclick=()=>vtest(v,o);d.append(t,b,o);L.append(d);
  });
}
let rc=0;
function rst(b){if(!rc){rc=1;b.textContent='Tap again to erase everything';return}rc=0;const n=S.name;S=fresh();S.name=n;save();home()}
function start(n){S.lastLesson=n;S.lastLessonAt=Date.now();save();if(D[n][1]==='s'||D[n][1].startsWith('g')){const q=D[n][4].split(';').map(s=>{const[a,b]=s.split('|');return{t:'s',tiles:a.split(' '),en:b}});unit=n;lim=n;Q=[{t:'n'},...shuffle(q)];total=q.length;ok=0;err=0;return next()}run(ALL.filter(x=>x.u===n),n)}
function sdraw(){const q=cur,t=q.tiles;document.getElementById('sa').innerHTML=q.sel.map(i=>`<button class="tile" onclick="stap(${i},0)">${t[i]}</button>`).join('')||'<span class="sub" style="align-self:center">Tap the words below</span>';document.getElementById('sb').innerHTML=q.bank.filter(i=>!q.sel.includes(i)).map(i=>`<button class="tile" onclick="stap(${i},1)">${t[i]}${S.romaji?`<small>${esc(toRomaji(t[i]))}</small>`:''}</button>`).join('')}
function stap(i,a){if(done)return;a?cur.sel.push(i):cur.sel=cur.sel.filter(x=>x!==i);sdraw()}
function schk(){if(done||!cur.sel.length)return;const t=cur.tiles;fb(cur.sel.map(i=>t[i]).join(' ')===t.join(' '),t.join(' '))}
function listen(){const Rc=window.SpeechRecognition||window.webkitSpeechRecognition,h=document.getElementById('heard');if(!Rc)return;try{const r=new Rc();r.lang='ja-JP';r.onresult=e=>{const t=e.results[0][0].transcript;h.textContent='Heard: '+t+(t.replace(/\s/g,'').includes(cur.it.j)?' ✓ Great!':' (try again)')};r.onerror=()=>{h.textContent='Microphone not available. Check the permission.'};h.textContent='Listening…';r.start()}catch(e){h.textContent='Microphone not available.'}}
function review(){
  const w=Object.keys(S.miss).filter(j=>S.miss[j]>0).sort((a,b)=>S.miss[b]-S.miss[a]).slice(0,5).map(j=>ALL.find(x=>x.j===j)).filter(Boolean);
  if(w.length)run(w,-1);
}
function run(items,n){
  unit=n;lim=n<0?99:n;Q=[];if(n>=0&&D[n][3])Q.push({t:'n'});
  if(n>=0)items.forEach(it=>Q.push({t:'i',it}));
  Q.push(...shuffle(items.flatMap(it=>['a','b','c'].map(t=>({t,it})))));
  total=items.length*3;ok=0;err=0;next();
}
function shell(b){A.innerHTML=`<div class="lesson-top"><button class="x" onclick="home()" aria-label="Quit lesson">✕</button><div class="lesson-progress"><div class="bar"><i style="width:${ok/total*100}%"></i></div><small>${ok} / ${total}</small></div></div><main class="les lesson-stage"><div class="lesson-content">${b}</div><div id="msg" aria-live="polite"></div></main><div id="fb"></div>`}
function btn(l,f){document.getElementById('fb').innerHTML=`<div class="fb"><button class="main" onclick="${f}">${l}</button></div>`}
const spk=`<button class="spk" onclick="say(cur.it.j,1)">Hear it</button>`;
const fs=s=>s.length>3?56:88;
function next(){
  if(!Q.length)return fin();
  cur=Q[0];done=false;const q=cur,it=q.it;
  if(q.t==='n'){shell(`<p class="sub">Good to know</p><p class="big" style="font-size:22px;line-height:1.6">${D[unit][3]}</p>`);btn('Got it','nx()');return}
  if(q.t==='s'){q.bank=shuffle(q.tiles.map((_,i)=>i));q.sel=[];shell(`<p class="sub">Translate this sentence</p><p class="big" style="font-size:28px">${q.en}</p><div class="sa" id="sa"></div><div class="sb" id="sb"></div>`);btn('Check','schk()');sdraw();return}
  const pool=ALL.filter(x=>x.k===it.k&&x.u<=lim&&isW(x)===isW(it));
  if(q.t==='i'){
    shell(`<p class="sub">New ${isW(it)?'word':it.k=='k'?'kanji':'character'}</p><div class="big" style="font-size:${fs(it.j)}px">${it.j}</div><p class="rom">${rd(it)}</p>${it.m?`<p class="sub">${it.m}</p>`:''}${spk}`);
    btn('Got it','nx()');say(it.j);return;
  }
  if(q.t==='a'){
    const c=ans(it);opts=shuffle([c,...ds(pool.map(ans),c)]);
    shell(`<p class="sub">What is this?</p><div class="big" style="font-size:${fs(it.j)}px">${it.j}</div>${spk}<div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="choose(${i})">${o}</button>`).join('')}</div>`);
  }else if(q.t==='b'){
    const c=it.j;opts=shuffle([c,...ds(pool.map(x=>x.j),c)]);const a=ans(it);
    shell(`<p class="sub">Which one is this?</p><div class="big" style="font-size:${a.length>3?44:88}px">${a}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="choose(${i})">${o}</button>`).join('')}</div>`);
  }else{
    shell(`<p class="sub">Type the reading in English letters (romaji)</p><div class="big" style="font-size:${fs(it.j)}px">${it.j}</div>${spk}${isW(it)&&(window.SpeechRecognition||window.webkitSpeechRecognition)?' <button class="spk" onclick="listen()">Say it</button><p class="sub" id="heard"></p>':''}<input class="t" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" onkeydown="if(event.key==='Enter')done?nx():chk()">`);
    btn('Check','chk()');document.getElementById('inp').focus();
  }
}
function choose(i){
  if(done)return;const c=cur.t==='a'?ans(cur.it):cur.it.j;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(opts[k]===c)b.classList.add('ok');else if(k===i)b.classList.add('bad')});
  fb(opts[i]===c,c);
}
function chk(){
  if(done)return;const v=document.getElementById('inp').value;if(!v.trim())return;
  document.getElementById('inp').disabled=true;
  const it=cur.it,sv=sp(v);fb(v.trim()===it.j||(sv!==null&&it.r.split('|').some(r=>rvars(r).includes(sv))),it.r.split('|').join(' or '));
}
function fb(good,shown){
  done=true;const it=cur.it||{j:cur.tiles.join('')};
  if(good){ok++;S.right++;if(S.miss[it.j])S.miss[it.j]--}else{err++;S.wrong++;if(cur.it)S.miss[it.j]=(S.miss[it.j]||0)+1;Q.push({...cur,sel:[],bank:cur.bank&&shuffle(cur.bank)})}
  document.querySelector('.bar i').style.width=ok/total*100+'%';
  sfx(good);try{navigator.vibrate&&navigator.vibrate(good?20:[60,40,60])}catch(e){}
  const m=document.getElementById('msg');
  m.innerHTML=`<div class="msg ${good?'g':'b'}"><b>${good?'✓ Correct!':'✗ Not quite'}</b>${good&&!cur.tiles?'':`<span>${good?'':'Correct answer: '}${shown}</span>${cur.tiles?`<span>${esc(cur.tiles.map(x=>toRomaji(x)).join(' '))}</span>`:''}`}</div>`;
  m.scrollIntoView({block:'nearest'});
  const f=document.getElementById('fb');f.className=good?'g':'b';
  f.innerHTML=`<div class="fb"><button class="main ${good?'good':'bad'}" onclick="nx()">Continue</button></div>`;
  setTimeout(()=>say(it.j),400);save();
}
function nx(){Q.shift();next()}
function fin(){
  const xp=10+Math.max(0,5-err)*2,a=Math.round(total/(total+err)*100);
  S.xp+=xp;S.today+=xp;S.lessons++;S.hist[day()]=(S.hist[day()]||0)+xp;if(!err)S.perfect=1;if(unit>=0)S.done[unit]=Math.min(3,(S.done[unit]||0)+1);
  S.streak=gap()===0?S.streak:(gap()<=2?S.streak+1:1);S.last=day();S.best=Math.max(S.best||0,S.streak);save();sfx(1);
  A.innerHTML=`<div class="les" style="padding-top:70px"><div class="big" style="font-size:52px">よくできました</div><p class="sub">Well done! Lesson complete.</p><div class="res"><div><b>+${xp}</b><small>XP</small></div><div><b>${a}%</b><small>Accuracy</small></div></div></div><div id="fb"><div class="fb"><button class="main" onclick="home()">Continue</button></div></div>`;
}
try{if(typeof speechSynthesis!=="undefined"){speechSynthesis.getVoices();speechSynthesis.addEventListener("voiceschanged",()=>{if(view==="prof")prof()})}}catch(e){}
applyTheme();
home();
</script></body></html>
