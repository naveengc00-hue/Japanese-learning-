<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#17203a;--mut:#667089;--pri:#3b4cca;--pri2:#2b3aa8;--ok:#1fa971;--okbg:#d9f5e8;--bad:#e5484d;--badbg:#fde3e4;--line:#d5dbe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#1a2140;--ink:#eef1fb;--mut:#9aa4c4;--pri:#6676f0;--pri2:#4b5ad6;--okbg:#123a2c;--badbg:#44181b;--line:#2c3558;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#1a2140;--ink:#eef1fb;--mut:#9aa4c4;--pri:#6676f0;--pri2:#4b5ad6;--okbg:#123a2c;--badbg:#44181b;--line:#2c3558;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-weight:500}

button{font:inherit;color:inherit;cursor:pointer}

.main{width:100%;background:var(--pri);color:var(--onpri,#fff);border:0;border-bottom:4px solid var(--pri2);border-radius:14px;padding:14px 20px;font-weight:900;font-size:17px}
.main.bad{background:var(--bad);border-bottom-color:#b3262b}.main.good{background:var(--ok);border-bottom-color:#14784f}
.main:active{transform:translateY(2px);border-bottom-width:2px}
.alt{width:100%;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px;font-weight:700;margin-top:26px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}

.node:active .c{transform:translateY(3px);border-bottom-width:3px}

.top{display:flex;align-items:center;gap:14px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:16px 8px;font-size:22px;font-weight:700}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}

.msg{margin-top:22px;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;animation:pop .25s}
.msg b{font-size:26px}.msg span{font-size:18px;font-weight:700}
.msg.g{background:var(--okbg);color:var(--ok)}.msg.b{background:var(--badbg);color:var(--bad)}

@media (prefers-reduced-motion:reduce){.msg{animation:none}}
#fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
#fb.g{background:var(--okbg)}#fb.b{background:var(--badbg)}
.fb{max-width:480px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 3px;font-size:12px;white-space:nowrap;font-weight:700;color:var(--mut)}
nav button.on{color:var(--pri)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.res div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.res b{display:block;font-size:26px;color:var(--pri)}.res small{color:var(--mut);font-weight:700}
.pc{display:flex;align-items:center;gap:14px;margin-top:18px}
.pc input.t{margin:0;text-align:left;font-size:20px}
.sw{display:flex;gap:10px;margin-top:14px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}
.row button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}
.row button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri,#fff)}
.hd{margin:22px 0 0;color:var(--mut);font-weight:700}
.note{color:var(--mut);font-size:14px;margin:8px 2px 0}
.sa{min-height:64px;border-bottom:2px solid var(--line);margin:18px 0;display:flex;flex-wrap:wrap;justify-content:center}.sb{display:flex;flex-wrap:wrap;justify-content:center}
.tile{margin:5px;padding:10px 14px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;font-size:22px;font-weight:700}.tile small{display:block;font-size:11px;color:var(--mut)}
.hero{display:flex;gap:14px;align-items:center;margin-top:18px}.hw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.hw .bar{flex:none}.hw input.t{margin:0;text-align:left;font-size:20px;padding:10px 12px}.lv{font-weight:900;color:var(--pri)}.hw small{color:var(--mut);font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pr{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:10px;font-weight:700}.pr small{color:var(--mut);text-align:right}
.wk{flex-direction:row;justify-content:space-between;align-items:flex-end}.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.col{height:70px;width:70%;max-width:26px;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.col i{display:block;width:100%;background:var(--ok)}.wd small{color:var(--mut);font-weight:700}
.bds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bd{padding:6px 12px;border-radius:20px;border:2px solid var(--line);color:var(--mut);font-weight:700;font-size:14px;opacity:.7}.bd.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:1}
.two{display:flex;gap:10px}.two>*{flex:1}
.fc{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:30px 14px;min-height:260px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.pad{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:16px;background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:2px 100%,100% 2px;background-position:center;background-repeat:no-repeat}
.gd{position:absolute;inset:0;display:grid;place-items:center;font-size:min(62vw,220px);line-height:1;font-weight:700;opacity:.22;color:var(--pri);pointer-events:none}.gd.off{visibility:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wb{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.gridc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.wu{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;text-align:left}.wu.ok{border-color:var(--ok);background:var(--okbg)}.wc{font-size:26px;font-weight:900;letter-spacing:2px;color:var(--pri);min-width:120px}.wt{display:flex;flex-direction:column}.wt small{color:var(--mut);font-weight:700}
.main.good,.main.bad{color:#fff}
#toast{position:fixed;left:16px;right:16px;bottom:100px;max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#toast.show{opacity:1}
.row select{font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px;max-width:170px}
.r{display:block;margin-top:6px;font-weight:700}.r.ok{color:var(--ok)}.r.bad{color:var(--bad)}

/* ===== Kotoba 2.0: minimal indigo responsive design layer ===== */
:root {
  --bg: #f6f7fc;
  --card: #ffffff;
  --ink: #17203a;
  --mut: #68728a;
  --pri: #4657d5;
  --pri2: #3544b5;
  --ok: #16875f;
  --okbg: #e4f6ee;
  --bad: #cf3f4a;
  --badbg: #fff0f1;
  --line: #e2e6f0;
  --onpri: #ffffff;
  --soft: color-mix(in srgb, var(--pri) 14%, var(--card));
  --surface: var(--card);
  --text: var(--ink);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #101426;
  --card: #191f35;
  --ink: #f0f2fb;
  --mut: #a2abc3;
  --pri: #8290ff;
  --pri2: #6473ed;
  --ok: #55c995;
  --okbg: #163b30;
  --bad: #ff7a83;
  --badbg: #421f2a;
  --line: #303952;
  --onpri: #101426;
  --soft: color-mix(in srgb, var(--pri) 20%, var(--card));
  --surface: var(--card);
  --text: var(--ink);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101426;
    --card: #191f35;
    --ink: #f0f2fb;
    --mut: #a2abc3;
    --pri: #8290ff;
    --pri2: #6473ed;
    --ok: #55c995;
    --okbg: #163b30;
    --bad: #ff7a83;
    --badbg: #421f2a;
    --line: #303952;
    --onpri: #101426;
    --soft: color-mix(in srgb, var(--pri) 20%, var(--card));
    --surface: var(--card);
    --text: var(--ink);
    color-scheme: dark;
  }
}
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(ellipse at 50% -18%, rgba(70,87,213,.08), transparent 48%),
    var(--bg);
  letter-spacing: .005em;
  -webkit-font-smoothing: antialiased;
}
#app {
  width: min(100%, 1120px);
  max-width: 1120px;
  min-height: 100vh;
  padding: 26px 24px 116px;
}
header { margin-bottom: 20px; }
.logo { letter-spacing: -.045em; font-size: 28px; }
.stat { line-height: 1.55; }
button, input, select { -webkit-tap-highlight-color: transparent; }
button { transition: background-color .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--pri) 55%, transparent);
  outline-offset: 3px;
}
.main, .alt, .opt, .wu, .fc, .node .c, .tile {
  box-shadow: 0 2px 0 rgba(20, 29, 65, .035);
}
.main {
  border-radius: 13px;
  border-bottom-width: 2px;
  padding: 14px 20px;
  box-shadow: 0 5px 14px rgba(53,68,181,.12);
}
.main:active { transform: translateY(1px); border-bottom-width: 1px; }
.alt {
  border-width: 1px;
  border-bottom-width: 2px;
  border-radius: 13px;
  margin-top: 16px;
}
.seg { gap: 8px; margin: 18px 0; scrollbar-width: thin; }
.seg button {
  border-width: 1px;
  border-radius: 11px;
  padding: 10px 15px;
}
.card, .res div, .row, .wu, .fc, .pad {
  border-width: 1px;
  border-color: var(--line);
  box-shadow: 0 5px 18px rgba(25, 35, 75, .035);
}
.card { border-radius: 16px; padding: 16px; }
.row { border-radius: 13px; }
.node .c {
  width: 76px; height: 76px;
  border-radius: 23px;
  font-size: 32px;
  border-bottom-width: 3px;
}
.node.lock .c { border-radius: 23px; }
.node em { font-size: 14px; }
.node small { letter-spacing: 1px; }
.bar { background: color-mix(in srgb, var(--line) 78%, var(--bg)); }
.bar i { border-radius: 99px; }
.goal { gap: 9px; }
.big { letter-spacing: -.035em; }
.rom { letter-spacing: .01em; }
.spk {
  border-width: 1px;
  border-color: var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 8px 15px;
}
.opt {
  border-width: 1px;
  border-bottom-width: 2px;
  border-radius: 13px;
  min-height: 62px;
}
.wu {
  border-bottom-width: 2px;
  border-radius: 13px;
}
.fc { border-radius: 18px; }
.res { gap: 12px; }
.res div { border-radius: 14px; }
#fb {
  background: var(--bg);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
nav {
  z-index: 20;
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 28px rgba(20, 29, 65, .045);
  background: color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter: blur(14px);
}
nav button { padding: 15px 8px; font-size: 14px; }
nav button.on { font-weight: 900; }
#toast { box-shadow: 0 8px 28px rgba(0,0,0,.18); }
.note { line-height: 1.65; }
.hd { margin-top: 26px; }
@media (hover: hover) and (pointer: fine) {
  .seg button:hover, .spk:hover, .row button:hover {
    border-color: var(--pri);
  }
  .wu:hover, .opt:hover, .alt:hover, .fc:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 22px rgba(25, 35, 75, .075);
  }
  .node:not(.lock):hover .c { transform: translateY(-3px); }
}
@media (min-width: 760px) {
  #app { padding: 34px 36px 64px; }
  nav {
    position: fixed;
    top: 0; bottom: auto; left: 0; right: 0;
    width: 100%;
    justify-content: center;
    padding: 0 max(24px, calc((100vw - 1048px) / 2));
    border-top: 0;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 5px 20px rgba(20, 29, 65, .045);
  }
  nav button { flex: 0 1 150px; padding: 17px 14px; }
  #app { padding-top: 92px; }
  header { margin-bottom: 24px; }
  .path {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: stretch;
    gap: 16px;
    margin-top: 22px;
  }
  .node {
    transform: none !important;
    min-height: 150px;
    padding: 18px 12px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 5px 18px rgba(25, 35, 75, .035);
  }
  .node .c { margin-bottom: 5px; }
  .node.lock { opacity: .58; }
  .goal { margin-bottom: 22px; }
  .opts { gap: 14px; max-width: 720px; margin-left: auto; margin-right: auto; }
  .les { max-width: 760px; margin: 0 auto; padding-top: 28px; }
  .pad { max-width: 380px; }
  .res { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .gridc { grid-template-columns: repeat(8, minmax(0,1fr)); }
  .card { padding: 20px; }
  .hero { max-width: 680px; }
  .bds { max-width: 850px; }
  #fb { left: 0; right: 0; }
  #fb .fb { max-width: 760px; }
}
@media (min-width: 1080px) {
  .path { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .res { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (max-width: 420px) {
  #app { padding-left: 14px; padding-right: 14px; }
  .logo { font-size: 24px; }
  .seg button { padding: 9px 12px; }
  .node .c { width: 70px; height: 70px; }
  nav button { font-size: 12px; padding: 13px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
/* ===== End Kotoba 2.0 design layer ===== */


/* Kotoba UI refresh — static, lightweight, responsive */
:root { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
#app { width:min(100%,1080px); max-width:1080px; padding:24px 20px 112px; }
.home-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin:4px 0 22px; }
.home-header h1 { margin:0; font-size:32px; line-height:1.1; letter-spacing:-.04em; }
.home-header h1 span { color:var(--pri); }
.eyebrow { margin:0 0 6px; color:var(--mut); font-size:11px; font-weight:900; letter-spacing:.12em; }
.home-intro { margin:8px 0 0; color:var(--mut); font-size:14px; }
.home-stats { display:flex; gap:8px; }
.home-stats div { min-width:66px; padding:10px 12px; border:1px solid var(--line); border-radius:13px; background:var(--card); text-align:center; }
.home-stats b { display:block; color:var(--pri); font-size:19px; line-height:1.2; }
.home-stats small { color:var(--mut); font-size:10px; font-weight:800; white-space:nowrap; }
.daily-card { padding:17px; border:1px solid var(--line); border-radius:16px; background:var(--card); }
.daily-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.daily-top b { font-size:23px; }
.daily-top b span { color:var(--mut); font-size:13px; }
.daily-top strong { color:var(--pri); font-size:18px; }
.goal-track { height:9px; margin-top:13px; overflow:hidden; border-radius:20px; background:var(--line); }
.goal-track i { display:block; height:100%; border-radius:20px; background:var(--pri); }
.daily-card>p:last-child { margin:10px 0 0; color:var(--mut); font-size:12px; }
.learning-section { margin-top:28px; }
.section-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.section-heading h2 { margin:0; font-size:21px; letter-spacing:-.025em; }
.section-count { color:var(--mut); font-size:12px; font-weight:800; }
.category-tabs { display:flex; gap:7px; margin:14px 0; overflow-x:auto; padding-bottom:2px; }
.category-tab { flex:0 0 auto; padding:9px 13px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--mut); font-size:13px; font-weight:800; }
.category-tab.on { border-color:var(--pri); background:var(--pri); color:var(--onpri,#fff); }
.continue-card { display:flex; width:100%; justify-content:space-between; align-items:center; gap:12px; margin:0 0 12px; padding:15px 16px; border:1px solid var(--pri); border-radius:14px; background:var(--pri); color:var(--onpri,#fff); text-align:left; }
.continue-card span:first-child { display:flex; flex-direction:column; gap:3px; }
.continue-card small { font-size:10px; font-weight:900; letter-spacing:.1em; opacity:.82; }
.continue-card b { font-size:17px; }

</style></head>
<body><div id="app"></div>
<script>
const CAT={h:"Hiragana",t:"Katakana",k:"Kanji",s:"Grammar · N5",g4:"Grammar · N4",g3:"Grammar · N3",g2:"Grammar · N2"};
const D=[
["Vowels","h","あ a,い i,う u,え e,お o"],
["K row","h","か ka,き ki,く ku,け ke,こ ko"],
["S row","h","さ sa,し shi,す su,せ se,そ so","し is read shi, not si. Japanese has no plain “si” sound."],
["T row","h","た ta,ち chi,つ tsu,て te,と to","ち is chi and つ is tsu. These two break the plain t pattern."],
["N row","h","な na,に ni,ぬ nu,ね ne,の no"],
["H row","h","は ha,ひ hi,ふ fu,へ he,ほ ho","ふ sounds between f and h: say a soft fu. は is read ha, but as the topic particle it is read wa."],
["M row","h","ま ma,み mi,む mu,め me,も mo"],
["Y row","h","や ya,ゆ yu,よ yo"],
["R row","h","ら ra,り ri,る ru,れ re,ろ ro"],
["W row and n","h","わ wa,を wo|o,ん n","を sounds like o and is only used as a particle that marks the object. ん is the one lone consonant: n."],
["Vowels","t","ア a,イ i,ウ u,エ e,オ o","Katakana is mostly used for foreign words and names. The sounds are the same as hiragana, only the shapes differ."],
["K row","t","カ ka,キ ki,ク ku,ケ ke,コ ko"],
["S row","t","サ sa,シ shi,ス su,セ se,ソ so"],
["T row","t","タ ta,チ chi,ツ tsu,テ te,ト to"],
["N row","t","ナ na,ニ ni,ヌ nu,ネ ne,ノ no"],
["Numbers 1-5","k","一 ichi|hito one,二 ni|futa two,三 san|mi three,四 shi|yon four,五 go|itsu five","Most kanji have two kinds of readings. On’yomi come from Chinese and appear in compound words. Kun’yomi are native Japanese readings. You can type either one."],
["Nature","k","日 nichi|hi sun,月 getsu|tsuki moon,火 ka|hi fire,水 sui|mizu water,木 moku|ki tree"],
["People and places","k","人 jin|hito person,口 kou|kuchi mouth,山 san|yama mountain,川 sen|kawa river,大 dai|oo big"],
["Greetings","w","こんにちは konnichiwa hello,ありがとう arigatou thank you,はい hai yes,いいえ iie no,さようなら sayounara goodbye","In こんにちは the last は is read wa, not ha. Particles often keep an old spelling."],
["Everyday","w","あか aka red,ねこ neko cat,さかな sakana fish,たこ tako octopus,いけ ike pond"],
["1. Basic sentences: は and です","s","文","は marks the topic of a sentence. です makes a polite statement. Basic pattern: Topic は information です. The particle は is pronounced wa.","わたし は がくせい です|I am a student;これ は ほん です|This is a book;たなかさん は せんせい です|Mr./Ms. Tanaka is a teacher"],
["2. Questions with か","s","文","Add か to the end of a polite sentence to make a yes/no question. The word order usually stays the same.","あなた は がくせい です か|Are you a student?;これ は みず です か|Is this water?;にほんじん です か|Are you Japanese?"],
["3. Adding information with も","s","文","も means also or too. It replaces は when the new topic has the same description or action.","わたし も がくせい です|I am a student too;これ も わたし の ほん です|This is also my book;たなかさん も きます|Mr./Ms. Tanaka is coming too"],
["4. Possession and connection: の","s","文","の connects nouns. It can show possession, relationship, or category. Pattern: A の B.","わたし の ほん です|It is my book;にほんご の せんせい です|A Japanese-language teacher;これは たなかさん の かばん です|This is Tanaka's bag"],
["5. Demonstratives: これ・それ・あれ","s","文","これ means this near the speaker; それ means that near the listener; あれ means that over there. Use them before は or の.","これ は ほん です|This is a book;それ は なん です か|What is that?;あれ は がっこう です|That over there is a school"],
["6. Places: ここ・そこ・あそこ","s","文","ここ means here, そこ means there near the listener, and あそこ means over there. どこ asks where.","ここ は きょうしつ です|Here is a classroom;トイレ は どこ です か|Where is the toilet?;あそこ は としょかん です|Over there is a library"],
["7. Question words: だれ・なに・どこ","s","文","だれ asks who, なに asks what, and どこ asks where. Add です か for a polite question.","あの ひと は だれ です か|Who is that person?;これ は なん です か|What is this?;えき は どこ です か|Where is the station?"],
["8. The object particle を","s","文","を marks the direct object of an action. It is pronounced o. Pattern: person は object を verb.","わたし は みず を のみます|I drink water;パン を たべます|I eat bread;ほん を よみます|I read a book"],
["9. The place of an action: で","s","文","で marks the place where an action happens. Do not confuse it with に, which often marks a destination or location of existence.","としょかん で べんきょう します|I study at the library;うち で ごはん を たべます|I eat a meal at home;こうえん で あそびます|I play at the park"],
["10. Destination: に and へ","s","文","に and へ can mark a destination with movement verbs. へ is pronounced e. に often identifies the specific arrival point; へ emphasizes direction.","がっこう に いきます|I go to school;にほん へ いきます|I go to Japan;うち に かえります|I return home"],
["11. Time: に","s","文","に marks a specific time when an action happens. It is commonly used with clock times and days, but not every time expression needs it.","しちじ に おきます|I wake up at seven;げつようび に いきます|I go on Monday;にじ に べんきょう します|I study at two"],
["12. Together and with: と","s","文","と means and when connecting nouns, or with when naming a companion.","ともだち と いきます|I go with a friend;パン と たまご を かいます|I buy bread and eggs;はは と はなします|I talk with my mother"],
["13. From and until: から・まで","s","文","から marks a starting point and まで marks an ending point. They can describe time or place.","くじ から ごじ まで はたらきます|I work from nine until five;げつようび から きんようび まで|From Monday until Friday;えき から がっこう まで|From the station to the school"],
["14. Negative polite nouns and です","s","文","じゃありません (or ではありません) makes a polite noun sentence negative: A is not B.","わたし は せんせい じゃありません|I am not a teacher;これ は わたし の かばん じゃありません|This is not my bag;きょう は やすみ じゃありません|Today is not a day off"],
["15. あります and います","s","文","あります describes the existence of things and plants; います describes people and animals. Use に for where something exists.","つくえ の うえ に ほん が あります|There is a book on the desk;へや に ねこ が います|There is a cat in the room;こうえん に ひと が います|There are people in the park"],
["16. Adjectives: い-adjectives","s","文","い-adjectives usually end in い and come before a noun. They can also end a polite sentence with です.","おおきい いえ です|It is a big house;この ほん は おもしろい です|This book is interesting;あつい ひ です|It is a hot day"],
["17. Adjectives: な-adjectives","s","文","な-adjectives use な before a noun. Before です, do not add な.","しずかな まち です|It is a quiet town;この へや は きれい です|This room is clean;ゆうめいな ひと です|It is a famous person"],
["18. Negative い-adjectives","s","文","Change the final い to くない to make most い-adjectives negative. The special form いい becomes よくない.","たかくない です|It is not expensive;この ほん は おもしろくない です|This book is not interesting;きょう は あつくない です|It is not hot today"],
["19. Negative な-adjectives and nouns","s","文","Use じゃありません after a な-adjective or noun to make a polite negative statement.","この まち は しずか じゃありません|This town is not quiet;べんり じゃありません|It is not convenient;わたし は いしゃ じゃありません|I am not a doctor"],
["20. Past tense of です","s","文","でした is the polite past form of です. じゃありませんでした is the polite negative past.","きのう は あめ でした|It was rainy yesterday;こども の とき げんき でした|I was healthy as a child;せんしゅう は やすみ じゃありませんでした|Last week was not a holiday"],
["21. Polite verbs: ます","s","文","ます is the polite non-past ending for verbs. It can describe habits, general facts, or future actions depending on context.","まいにち べんきょう します|I study every day;あした いきます|I will go tomorrow;みず を のみます|I drink water"],
["22. Negative verbs: ません","s","文","ません is the polite negative form of a ます verb.","にく を たべません|I do not eat meat;きょう は いきません|I will not go today;コーヒー を のみません|I do not drink coffee"],
["23. Past verbs: ました","s","文","ました is the polite past form of a ます verb.","きのう べんきょう しました|I studied yesterday;パン を たべました|I ate bread;ともだち に あいました|I met a friend"],
["24. Negative past verbs: ませんでした","s","文","ませんでした is the polite negative past form: did not do.","きのう テレビ を みませんでした|I did not watch TV yesterday;あさごはん を たべませんでした|I did not eat breakfast;がっこう へ いきませんでした|I did not go to school"],
["25. Invitations and suggestions: ましょう","s","文","ましょう is used to suggest doing something together or to say let's do it.","いっしょに いきましょう|Let's go together;べんきょう しましょう|Let's study;やすみましょう|Let's take a break"],
["26. Requests: てください","s","文","てください is a polite way to ask someone to do something. It follows the verb's て-form.","ここ に なまえ を かいて ください|Please write your name here;ちょっと まって ください|Please wait a moment;ゆっくり はなして ください|Please speak slowly"],
["27. Permission: てもいいです","s","文","てもいいです asks for or gives permission: may do / it is okay to do.","ここ に すわっても いい です か|May I sit here?;しゃしん を とっても いい です|You may take a photo;はいっても いい です|You may enter"],
["28. Prohibition: てはいけません","s","文","てはいけません means an action is not allowed. It follows the verb's て-form.","ここ で たばこ を すって は いけません|You must not smoke here;この へや に はいって は いけません|You must not enter this room;ここ で あそんで は いけません|You must not play here"],
["29. Wanting to do: たいです","s","文","Attach たいです to the verb stem (the part before ます) to say you want to do something.","にほん へ いきたい です|I want to go to Japan;すし を たべたい です|I want to eat sushi;みず を のみたい です|I want to drink water"],
["30. Likes and dislikes: が すきです","s","文","が marks what someone likes or dislikes with すきです and きらいです. These expressions behave like な-adjectives.","ねこ が すき です|I like cats;にほんご が すき です|I like Japanese;さかな が きらい です|I dislike fish"],
["31. Ability: ことができます","s","文","Verb dictionary form + ことができます means can do something. This is a useful beginner pattern.","にほんご を はなす こと が できます|I can speak Japanese;およぐ こと が できます|I can swim;ひらがな を よむ こと が できます|I can read hiragana"],
["32. Reasons: から","s","文","から can connect a reason to a result. It means because, and usually follows the reason clause.","あめ です から いきません|I will not go because it is raining;いそがしい です から|Because I am busy;おいしい です から たべます|I eat it because it is delicious"],
["33. Comparing with より・ほうが","s","文","より marks the comparison point; ほうが marks the side that is more. Pattern: A より B の ほうが…です.","バス より でんしゃ の ほう が はやい です|The train is faster than the bus;きょう より あした の ほう が いい です|Tomorrow is better than today;コーヒー より おちゃ の ほう が すき です|I like tea more than coffee"],
["34. Choosing with どちら・どちらも","s","文","どちら asks which of two options. どちらも means both. This pattern is useful for simple choices.","コーヒー と おちゃ と どちら が すき です か|Which do you like, coffee or tea?;どちらも すき です|I like both;どちら が いい です か|Which one is better?"],
["35. Counting and つ","s","文","The general counter つ counts many objects from one to ten. Japanese also uses specific counters for different kinds of things.","りんご を ひとつ ください|One apple, please;みかん を ふたつ かいました|I bought two mandarins;ケーキ を みっつ たべました|I ate three cakes"],
["36. Frequency: いつも・よく・ときどき","s","文","Frequency words describe how often an action happens. They usually appear before the verb phrase.","いつも コーヒー を のみます|I always drink coffee;よく ほん を よみます|I often read books;ときどき えいが を みます|I sometimes watch movies"],
["37. Connecting actions: て-form","s","文","The て-form connects actions in sequence. First learn the form carefully; verb groups have different て-form changes.","あさ おきて かお を あらいます|I wake up and wash my face;ごはん を たべて がっこう へ いきます|I eat and go to school;ほん を よんで ねます|I read a book and sleep"],
["38. Ongoing actions: ています","s","文","て-form + います describes an action in progress or a continuing state.","いま べんきょう して います|I am studying now;あめ が ふって います|It is raining;とうきょう に すんで います|I live in Tokyo"],
["39. Before and after: まえに・あとで","s","文","まえに means before and あとで means after. Use them to put two actions in order.","ねる まえに は を みがきます|I brush my teeth before sleeping;ごはん の あとで べんきょう します|I study after the meal;でかける まえに でんわ します|I call before going out"],
["40. Experience: たことがあります","s","文","Verb past short form + ことがあります means have experienced doing something.","にほん へ いった こと が あります|I have been to Japan;すし を たべた こと が あります|I have eaten sushi before;ふじさん を みた こと が あります|I have seen Mount Fuji"],
["4-01. Plain form verbs","g4","文","Verb dictionary forms are used in casual speech and before many grammar patterns. Learn the three verb groups because their changes differ.","まいにち ほん を よむ|I read books every day;あした がっこう へ いく|I will go to school tomorrow;なに を たべる|What will you eat?"],
["4-02. Plain negative verbs","g4","文","Change verbs to the plain negative formない. Group 1 verbs change the final u sound to a; group 2 usually replace る with ない; irregular verbs are しない and こない.","きょう は いかない|I will not go today;コーヒー は のまない|I do not drink coffee;テレビ を みない|I do not watch TV"],
["4-03. Plain past verbs: た-form","g4","文","The た-form is the plain past form. Its changes follow the same sound groups as the て-form, with た/だ endings.","きのう えいが を みた|I watched a film yesterday;パン を かった|I bought bread;ともだち と はなした|I talked with a friend"],
["4-04. Plain past negative: なかった","g4","文","Add なかった to the negative verb stem to say did not do.","あさごはん を たべなかった|I did not eat breakfast;きのう は いかなかった|I did not go yesterday;その ほん は よまなかった|I did not read that book"],
["4-05. ことがある: past experience","g4","文","Verbた-form + ことがある describes an experience. The negative form ことがない means have never done it.","おきなわ へ いった こと が あります|I have been to Okinawa;すもう を みた こと が ありません|I have never watched sumo;この りょうり を たべた こと が あります|I have eaten this dish before"],
["4-06. ことにする: decide to","g4","文","Verb dictionary form or ない-form + ことにする expresses a personal decision.","まいにち うんどう する こと に しました|I decided to exercise every day;おさけ を のまない こと に しました|I decided not to drink alcohol;らいねん にほん へ いく こと に します|I will decide to go to Japan next year"],
["4-07. ことになる: it is decided","g4","文","Verb dictionary form or ない-form + ことになる describes a decision or arrangement made by circumstances or others.","らいげつ ひっこす こと に なりました|It has been decided that I will move next month;あした は やすむ こと に なりました|It has been arranged that I will take tomorrow off;ここ で たばこ を すわない こと に なっています|Smoking is not allowed here by rule"],
["4-08. つもり: intention","g4","文","Verb dictionary form + つもりです expresses an intention or plan. ない-form + つもりです expresses an intention not to do something.","にほんご を べんきょう する つもり です|I intend to study Japanese;くるま を かわない つもり です|I do not intend to buy a car;しゅうまつ は うち に いる つもり です|I plan to stay home this weekend"],
["4-09. 予定: scheduled plan","g4","文","Verb dictionary form or noun + の予定です describes a scheduled plan. It often sounds more fixed than つもり.","ごご さんじ に あう よてい です|I am scheduled to meet at 3 p.m.;らいしゅう しけん の よてい です|The exam is scheduled for next week;あした しゅっちょう する よてい です|I am scheduled to go on a business trip tomorrow"],
["4-10. ほうがいい: advice","g4","文","Verbた-form + ほうがいい recommends doing something. Verbない-form + ほうがいい recommends not doing it.","はやく ねた ほう が いい です|You should go to bed early;むり を しない ほう が いい です|You should not overdo it;びょういん へ いった ほう が いい です|You should go to the hospital"],
["4-11. なければならない: obligation","g4","文","ない-form without い + なければならない expresses necessity. A common conversational alternative is なきゃ.","べんきょう しなければ なりません|I must study;くすり を のまなければ なりません|I must take medicine;あした は はやく おきなければ なりません|I must wake up early tomorrow"],
["4-12. なくてもいい: no need","g4","文","ない-form without い + なくてもいいです means something is not necessary.","あした こなくても いい です|You do not have to come tomorrow;くつ を ぬがなくても いい です|You do not have to take off your shoes;ぜんぶ かかなくても いい です|You do not have to write everything"],
["4-13. てしまう: finish or regret","g4","文","て-form + しまう means to do something completely, or can express regret when something unwanted happens. Casual contraction: ちゃう/じゃう.","しゅくだい を して しまいました|I finished my homework;さいふ を わすれて しまいました|Unfortunately, I forgot my wallet;ケーキ を ぜんぶ たべちゃった|I ate all the cake (casual)"],
["4-14. ながら: while doing","g4","文","Verb stem before ます + ながら connects two simultaneous actions. The main action comes at the end.","おんがく を ききながら べんきょう します|I study while listening to music;あるきながら はなさないで|Do not talk while walking;コーヒー を のみながら はなしました|We talked while drinking coffee"],
["4-15. たり〜たりする: examples","g4","文","Verbた-form + り, repeated for examples, followed by する. It lists representative actions rather than every action.","にちようび は そうじ したり せんたく したり します|On Sundays I do things like clean and do laundry;えいが を みたり ほん を よんだり します|I do things like watch films and read books;やすみ に ねたり さんぽ したり しました|On my day off I did things like sleep and walk"],
["4-16. そうです: appearance","g4","文","Verb stem or adjective stem + そうです describes how something looks or seems. いい becomes よさそう; ない becomes なさそう.","この ケーキ は おいしそう です|This cake looks delicious;あめ が ふりそう です|It looks like it will rain;その かばん は たかそう です|That bag looks expensive"],
["4-17. そうです: hearsay","g4","文","Plain form + そうです reports information heard from another source. Do not confuse it with the appearance pattern.","あした は あめ だ そう です|I hear it will rain tomorrow;たなかさん は くる そう です|I hear Tanaka is coming;この みせ は やすい そう です|I hear this shop is inexpensive"],
["4-18. んです: explanation","g4","文","んです (のです) adds explanatory background or asks for an explanation. It often appears when responding to a situation or question.","どう した ん です か|What happened?;あたま が いたい ん です|The thing is, I have a headache;でんしゃ が おくれた ん です|The train was delayed, you see"],
["4-19. でしょう: likely / confirmation","g4","文","でしょう expresses probability or seeks agreement. Intonation and context determine whether it sounds like a guess or confirmation.","あした は はれる でしょう|It will probably be sunny tomorrow;この もんだい は むずかしい でしょう|This problem is probably difficult;そう でしょう|That is probably so / Right?"],
["4-20. かもしれない: possibility","g4","文","Plain form + かもしれない expresses possibility, often less certain than でしょう.","あした は ゆき かも しれません|It might snow tomorrow;かれ は こない かも しれない|He might not come;この みせ は もう しまった かも しれません|This shop may have already closed"],
["4-21. ので: because","g4","文","ので gives a reason and often sounds softer or more explanatory than から. Attach it to the appropriate plain form; nouns and な-adjectives use なので.","あめ が ふって いる ので でかけません|I will not go out because it is raining;びょうき なので やすみます|I will rest because I am ill;じかん が ない ので いそぎます|I will hurry because there is no time"],
["4-22. のに: although / despite","g4","文","のに connects a fact with an unexpected or contrasting result. It can convey surprise or disappointment.","べんきょう した のに わかりません|Although I studied, I do not understand;やすみ なのに はたらきます|Although it is a day off, I work;あめ なのに でかけました|Despite the rain, I went out"],
["4-23. ても: even if","g4","文","て-form + も means even if or even though. With adjectives and nouns, use the corresponding ても forms.","あめ が ふっても いきます|Even if it rains, I will go;たかくても かいます|I will buy it even if it is expensive;いそがしくても べんきょう します|Even if I am busy, I study"],
["4-24. ば conditional","g4","文","The ば-form expresses a condition: if A happens, B. Learn the verb and adjective conjugation patterns.","やすければ かいます|If it is cheap, I will buy it;はやく おきれば まにあいます|If you wake up early, you will make it;わからなければ きいて ください|If you do not understand, please ask"],
["4-25. たら conditional","g4","文","た-form + ら expresses if/when. It is flexible and often describes what happens after a condition is met.","うち に かえったら でんわ します|I will call when I get home;ひま だったら きて ください|If you are free, please come;おわったら おしえて ください|Tell me when you finish"],
["4-26. なら conditional / topic","g4","文","なら takes a topic or condition already raised in conversation. It can mean if that is the case or speaking of.","にほん へ いく なら はる が いい です|If you are going to Japan, spring is good;やすい もの なら これ です|If you want something inexpensive, this is it;ひらがな なら よめます|If it is hiragana, I can read it"],
["4-27. より〜のほうが: comparisons","g4","文","Use AよりBのほうが to say B is more than A. ほど〜ない expresses that something is not as much as something else.","バス より でんしゃ の ほう が はやい です|The train is faster than the bus;きょう は きのう ほど あつくない です|Today is not as hot as yesterday;こちら の ほう が べんり です|This one is more convenient"],
["4-28. 一番: superlative","g4","文","いちばん means the most or number one. Use it to identify the highest degree within a group.","くだもの の なか で りんご が いちばん すき です|Among fruits, I like apples the most;だれ が いちばん はやい です か|Who is the fastest?;これ が いちばん やすい です|This is the cheapest"],
["4-29. あげる・くれる・もらう","g4","文","あげる describes giving from the speaker side; くれる describes someone giving to the speaker or their in-group; もらう describes receiving.","わたし は ともだち に ほん を あげました|I gave a book to my friend;ともだち が わたし に はな を くれました|My friend gave me flowers;せんせい に じしょ を もらいました|I received a dictionary from my teacher"],
["4-30. てあげる・てくれる・てもらう","g4","文","て-form + あげる/くれる/もらう expresses doing a favour, with the verb showing whose perspective is emphasized.","ともだち に にほんご を おしえて あげました|I taught my friend Japanese;はは が りょうり を つくって くれました|My mother cooked for me;せんせい に なおして もらいました|I had my teacher correct it for me"],
["4-31. つもりはない: no intention","g4","文","Verb dictionary form + つもりはない denies an intention. It can sound stronger than simply saying ない.","うそ を つく つもり は ありません|I have no intention of lying;しごと を やめる つもり は ない です|I do not intend to quit my job;かれ に はなす つもり は ありません|I do not intend to tell him"],
["3-01. ようにする: make an effort","g3","文","Verb dictionary form or ない-form + ようにする expresses a deliberate effort or habit someone tries to maintain.","まいにち にほんご を よむ ように しています|I make a point of reading Japanese every day;おそく ならない ように します|I will try not to be late;やさい を たべる ように しています|I make an effort to eat vegetables"],
["3-02. ようになる: come to be able","g3","文","Verb dictionary form or potential form + ようになる describes a change that develops over time.","にほんご が はなせる ように なりました|I have become able to speak Japanese;はやく おきる ように なりました|I have come to wake up early;なっとう を たべられる ように なった|I have become able to eat natto"],
["3-03. ように言う: tell someone to","g3","文","Verb dictionary form or ない-form + ように言う reports an instruction or request indirectly.","せんせい は はやく くる ように いいました|The teacher told us to come early;いしゃ は おさけ を のまない ように いいました|The doctor told me not to drink alcohol;わすれない ように いって ください|Please tell them not to forget"],
["3-04. ことにしている: personal rule","g3","文","Verb dictionary form or ない-form + ことにしている describes a rule or habit the speaker has chosen and maintains.","まいあさ さんぽ する こと に しています|I make it a rule to walk every morning;よる おそく たべない こと に しています|I make it a rule not to eat late at night;えいご も べんきょう する こと に しています|I have made it a rule to study English too"],
["3-05. ことになっている: established rule","g3","文","Verb dictionary form + ことになっている describes a rule, schedule or arrangement already established.","ここ では くつ を ぬぐ こと に なっています|It is the rule to take off shoes here;しけん は らいしゅう おこなう こと に なっています|The exam is scheduled for next week;この へや では たべない こと に なっています|Eating is not allowed in this room"],
["3-06. わけだ: that explains it","g3","文","わけだ expresses a logical conclusion: no wonder, that is why, or it follows that.","まいにち れんしゅう した ん ですね。じょうず な わけ です|You practised every day. No wonder you are good;でんしゃ が ない から おそい わけ だ|There are no trains, so that explains the delay;かれ は せんせい だから くわしい わけ です|He is a teacher, so naturally he knows a lot"],
["3-07. わけではない: not necessarily","g3","文","わけではない partially denies an assumption. It means not necessarily or it is not that.","にほんご が きらい な わけ では ありません|It is not that I dislike Japanese;いつも いそがしい わけ では ない|I am not always busy;ぜんぶ わかった わけ では ありません|I did not necessarily understand everything"],
["3-08. はずだ: expectation","g3","文","Plain form + はずだ expresses a reasoned expectation or something the speaker believes should be true.","かれ は もう ついた はず です|He should have arrived already;この みせ は やすい はず です|This shop should be inexpensive;にもつ は きょう とどく はず です|The package should arrive today"],
["3-09. はずがない: impossible","g3","文","Plain form + はずがない expresses a strong belief that something cannot be true.","そんな こと が ある はず が ない|That cannot possibly happen;かれ が うそ を つく はず が ありません|There is no way he would lie;こんなに やすい はず が ない|It cannot possibly be this cheap"],
["3-10. べきだ: ought to","g3","文","Dictionary form + べきだ expresses what the speaker considers the right or responsible action. The negative is べきではない.","やくそく は まもる べき です|You should keep promises;ひと の はなし を きく べき です|You ought to listen to others;うそ を つく べき では ありません|You should not tell lies"],
["3-11. ことはない: no need to","g3","文","Verb dictionary form + ことはない reassures someone that an action is unnecessary.","そんなに しんぱい する こと は ありません|There is no need to worry so much;いそぐ こと は ない です|There is no need to hurry;あやまる こと は ない よ|You do not need to apologise"],
["3-12. てほしい: want someone to","g3","文","て-form + ほしい expresses that the speaker wants someone else to do something.","あなた に きて ほしい です|I want you to come;もっと ゆっくり はなして ほしい|I want you to speak more slowly;ここ に なまえ を かいて ほしい です|I want you to write your name here"],
["3-13. させる: causative","g3","文","The causative form can mean make or let someone do something. Conjugation depends on verb group.","はは は こども に やさい を たべさせました|The mother made the child eat vegetables;せんせい は がくせい を はしらせました|The teacher made the students run;すき な こと を させて ください|Please let me do what I like"],
["3-14. られる: passive","g3","文","The passive form presents the subject as affected by an action. It is also used for inconveniences and respectful speech.","わたし は せんせい に ほめられました|I was praised by the teacher;さいふ を ぬすまれました|My wallet was stolen;この ほん は たくさん の ひと に よまれています|This book is read by many people"],
["3-15. てある: prepared state","g3","文","Transitive verb て-form + ある describes a state resulting from someone intentionally doing something.","まど が あけて あります|The window has been left open;つくえ の うえ に しりょう が おいて あります|The documents have been placed on the desk;よやく が して あります|The reservation has been made"],
["3-16. ておく: do in advance","g3","文","て-form + おく means to do something beforehand or leave it in a certain state. Casual contraction: とく.","りょこう の まえ に ホテル を よやく して おきます|I will book the hotel before the trip;あとで つかう ので のこして おいて|Leave it because I will use it later;まえもって しらべて おきます|I will research it in advance"],
["3-17. てみる: try doing","g3","文","て-form + みる means to try doing something to see what it is like or what happens.","この りょうり を たべて みます|I will try this dish;にほんご で かいて みて ください|Please try writing it in Japanese;あたらしい くつ を はいて みました|I tried wearing the new shoes"],
["3-18. ていく: change from now on","g3","文","て-form + いく describes an action or change continuing away from the present toward the future.","これから さむく なって いきます|It will get colder from now on;にほんご を べんきょう して いきます|I will continue studying Japanese;ひと が へって いきました|The number of people gradually decreased"],
["3-19. てくる: change up to now","g3","文","て-form + くる describes a change or action that has developed up to the present, or movement toward the speaker.","にほんご が すこし わかって きました|I have gradually started to understand Japanese;あめ が ふって きました|It has started raining;ともだち が はしって きました|My friend came running toward me"],
["3-20. ばかり: just did","g3","文","Verbた-form + ばかり says something has just happened from the speaker’s perspective; the elapsed time can vary.","いま かえった ばかり です|I have just returned;ひっこした ばかり なので まだ しらない|I have only just moved, so I do not know yet;ごはん を たべた ばかり です|I have just eaten"],
["3-21. ところ: stage of action","g3","文","ところ shows whether an action is about to start (辞書形ところ), in progress (ているところ), or just finished (たところ).","いま でかける ところ です|I am just about to leave;いま しらべて いる ところ です|I am checking it right now;たったいま おわった ところ です|I have just finished"],
["3-22. 間・間に: during / while","g3","文","間 describes an entire period during which something continues. 間に identifies an event that occurs at some point within that period.","なつやすみ の あいだ りょこう しました|I travelled during summer vacation;るす の あいだ に ともだち が きました|A friend came while I was away;ねて いる あいだ おと が しました|There was a sound while I was sleeping"],
["3-23. たびに: every time","g3","文","Dictionary form or noun + の + たびに means each time something happens, another event or feeling follows.","この うた を きく たびに なつ を おもいだします|Every time I hear this song, I remember summer;あう たびに おおきく なります|Each time I meet them, they seem to have grown;りょこう の たびに しゃしん を とります|I take photos on every trip"],
["3-24. おかげで: thanks to","g3","文","おかげで introduces a favourable cause or help that led to a good result.","せんせい の おかげで ごうかく しました|Thanks to the teacher, I passed;くすり の おかげで げんき に なりました|Thanks to the medicine, I got better;ともだち の おかげで たのしかった|Thanks to my friend, it was fun"],
["3-25. せいで: because of (negative)","g3","文","せいで introduces a cause that led to an undesirable result. It often conveys blame or frustration.","あめ の せいで しあい が なくなりました|Because of the rain, the match was cancelled;ねぼう した せいで おくれました|I was late because I overslept;でんしゃ の おくれ の せいで まにあいませんでした|I missed it because of the train delay"],
["3-26. くせに: despite / even though","g3","文","Plain form + くせに criticizes someone for acting contrary to what is expected. It is blunt and often negative.","しって いる くせに おしえて くれない|Even though he knows, he will not tell me;やすい くせに べんり です|Despite being cheap, it is convenient;こども の くせに おとな みたい です|Despite being a child, he acts like an adult"],
["3-27. に違いない: must be","g3","文","Plain form + に違いない expresses a strong inference: must be or surely.","あの ひと は せんせい に ちがいない|That person must be a teacher;でんき が ついて いる から だれか いる に ちがいない|The light is on, so someone must be there;これは ほんもの に ちがいありません|This must be genuine"],
["3-28. ようだ: seems / appears","g3","文","Plain form + ようだ expresses an inference based on evidence or a resemblance. Nouns and な-adjectives use のようだ/なようだ as appropriate.","そと は さむい よう です|It seems cold outside;かれ は つかれて いる よう です|He seems tired;ゆめ の よう です|It is like a dream"],
["3-29. みたいだ: seems / like","g3","文","みたいだ is a more conversational form expressing resemblance or an impression.","あの くも は ひつじ みたい です|That cloud looks like a sheep;かれ は ねむい みたい だ|He seems sleepy;ここ は まるで えいが みたい です|This place is just like a movie"],
["3-30. らしい: seems / characteristic","g3","文","らしい can report hearsay or describe something typical of a person or thing. Context distinguishes the meanings.","あした は あめ らしい です|Apparently it will rain tomorrow;かれ は こない らしい|It seems he is not coming;こども らしい え です|It is a childlike drawing"],
["3-31. 一方だ: continue to change","g3","文","Verb dictionary form + 一方だ describes an ongoing change in one direction, often an undesirable trend.","しごと は いそがしく なる いっぽう です|Work is getting busier and busier;もの の ねだん は あがる いっぽう です|Prices keep rising;かんきょう は わるく なる いっぽう です|The environment keeps getting worse"],
["3-32. ば〜ほど: the more, the more","g3","文","ば-form + dictionary form + ほど expresses proportional change: the more one thing happens, the more another does.","れんしゅう すれば する ほど じょうず に なります|The more you practise, the better you become;かんがえれば かんがえる ほど わからない|The more I think, the less I understand;やすければ やすい ほど いい です|The cheaper it is, the better"],
["3-33. として: as / in the role of","g3","文","Noun + として identifies a role, capacity or viewpoint in which someone acts.","せんせい として はたらいて います|I work as a teacher;これは おみやげ として かいました|I bought this as a souvenir;かれ を ともだち として しょうかい します|I will introduce him as a friend"],
["3-34. について: about","g3","文","Noun + について means about or concerning a topic. についての comes before a noun.","にほん の れきし について べんきょう します|I study Japanese history;この もんだい について はなしたい|I want to talk about this problem;かんきょう について の ほん|A book about the environment"],
["3-35. によると: according to","g3","文","Noun + によると introduces the source of information, often followed by そうだ or ということだ.","ニュース に よると あした は はれる そう です|According to the news, it will be sunny tomorrow;せんせい に よると テスト は やさしい そう です|According to the teacher, the test is easy;ちょうさ に よると ねむる じかん が へっています|According to the survey, sleeping time is decreasing"],
["3-36. に対して: toward / in contrast","g3","文","Noun + に対して indicates the target of an action or contrasts two things.","せんせい は がくせい に たいして しんせつ です|The teacher is kind toward students;あに は あかるい の に たいして おとうと は しずか です|The older brother is cheerful, whereas the younger brother is quiet;しつもん に たいして こたえます|I will respond to the question"],
["3-37. にとって: from the perspective of","g3","文","Noun + にとって means from someone’s point of view or for someone.","わたし に とって かぞく が いちばん たいせつ です|For me, family is most important;こども に とって むずかしい もんだい です|It is a difficult problem for children;この けいけん は かれ に とって ひつよう です|This experience is necessary for him"],
["3-38. ために: purpose / reason","g3","文","Verb dictionary form or noun + の + ために expresses purpose; it can also express a cause in formal contexts.","にほん で はたらく ために にほんご を べんきょう します|I study Japanese in order to work in Japan;けんこう の ために うんどう します|I exercise for my health;じこ の ために でんしゃ が おくれました|The train was delayed because of an accident"],
["2-01. わけにはいかない: cannot afford to","g2","文","Verb dictionary form + わけにはいかない expresses a social, moral or practical reason that prevents an action.","あした しけん なので あそぶ わけには いきません|I cannot go out because I have an exam tomorrow;やくそく した から いかない わけには いかない|I cannot not go because I promised;ここ で あきらめる わけには いかない|I cannot give up here"],
["2-02. ないわけにはいかない: must do","g2","文","Verbない-form without い + わけにはいかない means one cannot avoid doing something; therefore, one must do it.","せきにんしゃ として せつめい しない わけには いきません|As the person responsible, I must explain;おれい を いわない わけには いかない|I must express my thanks;ほんとう の こと を はなさない わけには いかない|I have to tell the truth"],
["2-03. にほかならない: nothing other than","g2","文","Noun + にほかならない strongly identifies the true nature or cause of something.","せいこう は どりょく の けっか に ほかなりません|Success is nothing other than the result of effort;これは かれ の じしん の あらわれ に ほかならない|This is nothing other than an expression of his confidence;もんだい の げんいん は じゅんび ぶそく に ほかならない|The cause of the problem is nothing other than insufficient preparation"],
["2-04. にすぎない: no more than","g2","文","Noun or plain form + にすぎない downplays something as merely or no more than.","これは うわさ に すぎません|This is nothing more than a rumour;わたし は じぶん の いけん を のべた に すぎない|I merely stated my opinion;それ は ひとつ の れい に すぎません|That is only one example"],
["2-05. にかかわらず: regardless of","g2","文","Noun + にかかわらず means regardless of, without being affected by the stated condition.","ねんれい に かかわらず さんか できます|Anyone can participate regardless of age;てんき に かかわらず しあい は おこないます|The match will be held regardless of the weather;けっか に かかわらず つづけます|I will continue regardless of the result"],
["2-06. を問わず: irrespective of","g2","文","Noun + を問わず means regardless of or without distinction by the category named.","けいけん の うむ を とわず おうぼ できます|You may apply regardless of experience;せいべつ を とわず はたらけます|People can work regardless of gender;ひる よる を とわず でんわ が きます|Calls come day and night"],
["2-07. に応じて: according to","g2","文","Noun + に応じて means in accordance with or depending on.","けいけん に おうじて きゅうりょう が かわります|Salary changes according to experience;ひつよう に おうじて せつめい します|I will explain according to your needs;じょうきょう に おうじて たいおう します|We will respond according to the situation"],
["2-08. に基づいて: based on","g2","文","Noun + に基づいて indicates the basis or evidence on which something is done.","データ に もとづいて はんだん します|I will make a judgement based on data;ほうりつ に もとづいて きめました|It was decided based on the law;じじつ に もとづいた きじ|An article based on facts"],
["2-09. を通じて・を通して: through","g2","文","Noun + を通じて/を通して indicates a means, intermediary or entire period.","インターネット を とおして しりました|I learned about it through the internet;いちねん を とおして あたたかい|It is warm throughout the year;ともだち を つうじて しりあいました|We got to know each other through a friend"],
["2-10. に伴って: along with","g2","文","Noun or verb dictionary form + に伴って expresses a change or event occurring together with another.","けいざい の はってん に ともなって せいかつ が かわりました|Life changed along with economic development;じんこう が ふえる に ともなって もんだい も ふえます|Problems increase as the population grows;かかく の じょうしょう に ともなう えいきょう|Effects accompanying the price increase"],
["2-11. につれて: as / in proportion","g2","文","Verb dictionary form or noun + につれて describes two changes progressing together.","とし を とる に つれて かんがえかた が かわります|As people age, their way of thinking changes;さむく なる に つれて ゆき が ふえます|As it gets colder, the snow increases;じかん が たつ に つれて わすれて いきます|As time passes, I gradually forget"],
["2-12. にしたがって: in accordance with","g2","文","Verb dictionary form or noun + にしたがって expresses a corresponding change or following a rule/instruction.","けいざい が はってん する に したがって せいかつ も ゆたか に なった|As the economy developed, life became richer;せつめい に したがって そうさ して ください|Please operate it according to the instructions;ねんれい に したがって たいりょく が おちます|Physical strength declines with age"],
["2-13. 一方で: on the other hand","g2","文","一方で presents another side or contrasting fact. It can also describe simultaneous trends.","この しごと は たのしい いっぽうで いそがしい|This job is enjoyable, but on the other hand, it is busy;べんり に なる いっぽうで もんだい も ふえた|It became more convenient, while problems also increased;ちち は りょうり を する いっぽうで はは は そうじ を する|My father cooks, while my mother cleans"],
["2-14. 反面: while / on the flip side","g2","文","反面 introduces the opposite side or an undesirable counterpart of a quality.","この くるま は はやい はんめん ねだん が たかい|This car is fast, but on the other hand, it is expensive;じゆう な はんめん せきにん も おおきい|Freedom also brings great responsibility;べんり な はんめん つかいすぎる きけん が ある|While convenient, there is a risk of overuse"],
["2-15. ものの: although","g2","文","Plain form + ものの means although or even though, often followed by a result that differs from expectation.","やくそく した ものの いけなく なりました|Although I promised, I became unable to go;かって は みた ものの つかって いません|Although I bought it, I do not use it;べんきょう した ものの しけん に おちた|Although I studied, I failed the exam"],
["2-16. とはいえ: that said","g2","文","とはいえ acknowledges a preceding point but qualifies it with a contrasting reality.","はる と は いえ まだ さむい|Although it is spring, it is still cold;べんり と は いえ つかいかた に ちゅうい が ひつよう だ|That said, even though it is convenient, care is needed in how it is used;しっぱい した と は いえ まなぶ こと は おおい|Although I failed, there is much to learn"],
["2-17. にもかかわらず: despite","g2","文","Plain form or noun + にもかかわらず means despite or in spite of, and is relatively formal.","あめ にも かかわらず おおぜい あつまった|Despite the rain, many people gathered;ちゅうい した にも かかわらず まちがえた|Despite being careful, I made a mistake;かれ は びょうき にも かかわらず はたらいた|He worked despite being ill"],
["2-18. どころか: far from","g2","文","どころか rejects an expected degree and often introduces a stronger opposite reality.","かれ は えいご どころか にほんご も はなせない|Far from speaking English, he cannot even speak Japanese;やすむ どころか もっと いそがしく なった|Far from resting, I became even busier;かんたん どころか とても むずかしい|Far from easy, it is very difficult"],
["2-19. ばかりか: not only but also","g2","文","Noun or plain form + ばかりか adds a further, often more surprising, point.","かれ は えいご ばかりか フランスご も はなせる|He can speak not only English but also French;おかね ばかりか じかん も なくした|I lost not only money but also time;かれ は しっぱい した ばかりか うそ も ついた|He not only failed but also lied"],
["2-20. のみならず: not only","g2","文","Noun or plain form + のみならず is a formal expression meaning not only but also.","この くすり は おとな のみならず こども にも つかえます|This medicine can be used by children as well as adults;かれ は しごと のみならず べんきょう も している|He is doing not only work but also study;この もんだい は にほん のみならず せかい の もんだい だ|This is a problem not only for Japan but for the world"],
["2-21. に限らず: not limited to","g2","文","Noun + に限らず means not limited to the named category; other categories are included too.","この みせ は がくせい に かぎらず だれでも はいれます|This shop is open to everyone, not just students;にほん に かぎらず せかい で にんき です|It is popular around the world, not only in Japan;おとな に かぎらず こども も たのしめます|Children as well as adults can enjoy it"],
["2-22. に限る: best to","g2","文","Noun or verb dictionary form + に限る expresses a personal conclusion that something is best.","つかれた とき は ねる に かぎります|When tired, nothing beats sleeping;なつ は ビール に かぎる|In summer, beer is the best;かぜ の とき は やすむ に かぎります|When you have a cold, it is best to rest"],
["2-23. に限り: only","g2","文","Noun + に限り restricts something to the specified person, time or group.","きょう に かぎり むりょう です|Today only, it is free;がくせい に かぎり わりびき します|We offer discounts to students only;ごじ まで に かぎり うけつけます|We accept applications until 5 only"],
["2-24. に違いない vs に相違ない","g2","文","に違いない expresses strong certainty; に相違ない is a more formal equivalent often used in writing.","かれ が せいこう する に ちがいない|He will surely succeed;これは ほんもの に そうい ありません|This is undoubtedly genuine;かれ の はんだん は ただしい に ちがいない|His judgement must be correct"],
["2-25. おそれがある: risk","g2","文","Verb dictionary form or noun + の + おそれがある expresses a possibility of an undesirable event, common in news and formal notices.","たいふう が せっきん する おそれ が あります|There is a risk that a typhoon will approach;この みず は あんぜん でない おそれ が ある|There is a possibility this water is unsafe;じこ が おこる おそれ が あります|There is a risk of an accident"],
["2-26. かねない: might (undesirable)","g2","文","Verb stem + かねない indicates a real possibility of an undesirable result.","そんな こと を いう と かれ を きずつけかねない|If you say that, you might hurt him;この まま では しっぱい しかねません|At this rate, we may fail;むり を すると びょうき に なりかねない|If you overdo it, you could get sick"],
["2-27. かねる: find it difficult to","g2","文","Verb stem + かねる politely indicates that the speaker cannot do something or finds it difficult to accept.","その ごようぼう には おうじかねます|We are unable to comply with that request;すぐ には はんだん しかねます|I cannot make a decision immediately;こたえ かねる しつもん です|It is a question I find difficult to answer"],
["2-28. ざるを得ない: have no choice","g2","文","Verbない-form without ない + ざるを得ない means one has no choice but to do something. する becomes せざるを得ない.","あめ なので けいかく を へんこう せざるを えない|Because of the rain, we have no choice but to change the plan;しごと を やめざるを えなかった|I had no choice but to quit the job;みとめざるを えません|I cannot help but admit it"],
["2-29. ずにはいられない: cannot help doing","g2","文","Verbない-form without ない + ずにはいられない expresses an action or feeling one cannot suppress. する becomes せずにはいられない.","その はなし を きいて わらわずには いられなかった|I could not help laughing when I heard that story;こども の しゃしん を みる と おもいださずには いられない|When I see photos of the children, I cannot help remembering;おうえん せずには いられません|I cannot help cheering"],
["2-30. ないことには: unless","g2","文","Verbない-form + ことには introduces a necessary condition: unless this happens, the next result cannot happen.","じっさい に つかわない ことには わかりません|Unless you actually use it, you will not know;はなして みない ことには はんだん できない|Unless we talk, we cannot decide;じぶん で やって みない ことには むずかしさ が わからない|Unless you try it yourself, you will not understand the difficulty"],
["2-31. 上で: after / in doing","g2","文","Verbた-form + 上で means after doing something; dictionary form + 上で means in doing or when considering something.","よく かんがえた うえで へんじ します|I will reply after thinking carefully;せつめい を きいた うえで きめます|I will decide after hearing the explanation;けいやく する うえで たいせつ な こと|Important things when making a contract"],
["2-32. 上に: in addition","g2","文","Plain form + 上に adds another reason or quality, often reinforcing the same evaluation.","この へや は ひろい うえに あかるい|This room is spacious and, in addition, bright;かれ は しんせつ な うえに しごと も はやい|He is kind, and furthermore works quickly;あめ が ふった うえに かぜ も つよかった|On top of the rain, the wind was strong"],
["2-33. 末に: after a long process","g2","文","Verbた-form or noun + の + 末に describes a result reached after much time, effort or consideration.","なんど も はなしあった すえに けつろん を だした|After discussing it many times, we reached a conclusion;なやんだ すえに しんがく を きめた|After much worrying, I decided to go on to higher education;ながい どりょく の すえ の せいこう|Success after long effort"],
["2-34. あげく: after all that","g2","文","Verbた-form or noun + の + あげく describes an often undesirable outcome after a long or troublesome process.","さんざん まよった あげく かわなかった|After much hesitation, I did not buy it;けんか の あげく わかれて しまった|After a quarrel, they ended up separating;ながい ぎろん の あげく けつろん が でなかった|After a long debate, no conclusion was reached"],
["2-35. 最中に: in the middle of","g2","文","Noun + の or verbている + 最中に identifies an event occurring right in the middle of an activity.","しょくじ の さいちゅう に でんわ が なりました|The phone rang in the middle of the meal;かいぎ を して いる さいちゅう に じしん が あった|There was an earthquake in the middle of the meeting;いま しごと の さいちゅう です|I am in the middle of work now"],
["2-36. ところを: at the moment / despite","g2","文","ところを politely acknowledges someone’s situation or an inconvenient moment when making a request or apology.","おいそがしい ところ を ありがとう ございます|Thank you despite your being busy;おやすみ の ところ を もうしわけ ありません|I am sorry to bother you on your day off;おたのしみ の ところ を しつれい します|Excuse me for interrupting your enjoyment"],
["2-37. に先立って: prior to","g2","文","Noun + に先立って is a formal expression meaning prior to or before an important event.","かいぎ に さきだって しりょう を くばります|We will distribute materials prior to the meeting;しゅっぱつ に さきだち てんけん を おこなう|An inspection will be conducted before departure;はっぴょう に さきだって せつめい が あった|There was an explanation prior to the announcement"],
["2-38. をめぐって: concerning / around","g2","文","Noun + をめぐって describes debate, conflict or discussion surrounding an issue.","その けん を めぐって いけん が わかれた|Opinions were divided over that matter;りけん を めぐる もんだい|A problem surrounding vested interests;かんきょう ほご を めぐって ぎろん した|We debated environmental protection"],
["2-39. に関して: concerning","g2","文","Noun + に関して is a formal way to say concerning or with regard to.","けいやく に かんして しつもん が あります|I have a question regarding the contract;この けん に かんする しりょう|Documents concerning this matter;あんぜん に かんして せつめい します|I will explain regarding safety"],
["2-40. に対して: in contrast / toward","g2","文","Noun + に対して marks an object of action or a contrasting counterpart.","しつもん に たいして ていねい に こたえた|I answered the question politely;ちち が げんじつてき なの に たいして はは は ゆめ を おう|My father is realistic, whereas my mother follows her dreams;おきゃくさま に たいする たいど|Attitude toward customers"],
["2-41. において: in / at","g2","文","Noun + において is a formal expression for a place, field or situation where something occurs.","かいぎ は とうきょう に おいて おこなわれます|The meeting will be held in Tokyo;きょういく に おいて たいせつ な こと|An important thing in education;げんだい しゃかい に おいて じょうほう は じゅうよう だ|Information is important in modern society"],
["2-42. にわたって: over / throughout","g2","文","Noun + にわたって describes something extending over a period, range or area.","さんじかん に わたって はなしあった|We discussed it for three hours;ぜんこく に わたって あめ が ふった|It rained throughout the country;ながねん に わたる けんきゅう|Research spanning many years"],
["2-43. を中心に: centered on","g2","文","Noun + を中心に describes something organized around a central person, place or theme.","えき を ちゅうしん に まち が はってん した|The town developed around the station;わかもの を ちゅうしん に にんき が ある|It is popular mainly among young people;かんじ を ちゅうしん に べんきょう します|We will study with kanji as the central focus"],
["2-44. にかけては: when it comes to","g2","文","Noun + にかけては highlights a field in which someone is especially skilled or distinctive.","りょうり に かけては はは に かなわない|When it comes to cooking, I cannot beat my mother;すうがく に かけては かれ が いちばん だ|When it comes to mathematics, he is the best;うんてん に かけては じしん が あります|I am confident when it comes to driving"],
["2-45. からこそ: precisely because","g2","文","Plain form + からこそ emphasizes that the stated reason is exactly why the result occurs.","しんじて いる からこそ ほんとう の こと を いう|Precisely because I trust you, I tell you the truth;すき だからこそ つづけられる|It is precisely because I like it that I can continue;くろう した からこそ せいこう が うれしい|Precisely because I struggled, success makes me happy"],
["2-46. ばこそ: precisely because (formal)","g2","文","ば-form + こそ is a formal emphatic expression meaning precisely because.","あなた の こと を おもう から こそ ちゅうこく する|It is precisely because I care about you that I warn you;どりょく すれば こそ けっか が でる|Results come precisely when you make an effort;あいすれば こそ きびしく する|It is precisely because I love you that I am strict"],
["2-47. ものなら: if one could","g2","文","Verb potential form + ものなら expresses a hypothetical possibility, often something difficult or unlikely.","いける ものなら もういちど いきたい|If I could, I would like to go once more;やりなおせる ものなら やりなおしたい|If I could do it over, I would;かえる ものなら かえりたい|If I could go home, I would like to"],
["2-48. ようものなら: if by chance","g2","文","Verb volitional form + ものなら warns that if an action occurs, a serious consequence will follow.","そんな こと を いおう ものなら おこられる|If you were to say such a thing, you would get scolded;ここで まちがえよう ものなら たいへん だ|If we were to make a mistake here, it would be serious;おくれよう ものなら しかられる|If I were to be late, I would be scolded"],
["2-49. ないものか: wish / is there no way","g2","文","ないものか expresses a strong wish or search for a way to make something happen.","もう すこし やすく ならない もの でしょう か|Is there no way it could be a little cheaper?;なんとか できない もの か|Is there not something we can do?;もっと かんたん に ならない もの かな|I wonder if it could not be made easier"],
["2-50. ものだ: general truth / nostalgia","g2","文","ものだ has several uses: general truths, customary behaviour, nostalgia, or strong feeling. Interpret it from context.","こども は よく あそぶ もの だ|Children naturally play a lot;むかし は よく ここ へ きた もの だ|I used to come here often;じかん が たつ の は はやい もの だ|Time really does pass quickly"],
["2-51. というものだ: that is what it means","g2","文","というものだ gives a strong evaluation or defines what something truly amounts to.","やくそく を まもる の が しんらい という もの だ|Keeping promises is what trust is;これ こそ ほんとう の しあわせ という もの だ|This is what true happiness is;それ は ひどい という もの です|That is simply outrageous"],
["2-52. というものではない: not necessarily","g2","文","というものではない rejects a simplistic generalization: it is not necessarily the case that.","おかね が あれば しあわせ という もの では ない|Having money does not necessarily mean being happy;べんきょう すれば いい という もの では ない|It is not simply a matter of studying;たかければ いい という もの では ありません|Expensive does not automatically mean good"],
["2-53. にしては: considering / for","g2","文","Noun or plain form + にしては evaluates something as surprising relative to an expectation.","はじめて に しては じょうず です|You are good considering it is your first time;こども に しては おとなしい|He is quiet for a child;この みせ は やすい に しては おいしい|This shop is tasty considering how cheap it is"],
["2-54. わりに: although / for","g2","文","Plain form + わりに expresses an unexpected result relative to a condition or standard.","この くるま は ねだん の わりに いい|This car is good for its price;かれ は わかい わりに おちついて いる|He is calm for someone so young;たくさん たべた わりに やせて いる|Despite eating a lot, he is thin"],
["2-55. だけあって: as expected of","g2","文","Plain form or noun + だけあって expresses that a result is fitting or expected given a quality or reputation.","ゆうめい な みせ だけあって おいしい|As expected of a famous restaurant, it is delicious;プロ だけあって じょうず だ|As expected of a professional, he is skilled;ながねん れんしゅう した だけあって はやい|As expected after years of practice, he is fast"],
["2-56. だけに: precisely because","g2","文","Plain form or noun + だけに means precisely because, emphasizing a result that follows from the stated reason.","きたい して いた だけに がっかり した|Precisely because I expected a lot, I was disappointed;しんゆう だけに なんでも はなせる|Precisely because we are close friends, I can talk about anything;たいせつ な ひ だけに わすれられない|Precisely because it was an important day, I cannot forget it"],
["2-57. ばかりに: simply because","g2","文","Plain form + ばかりに emphasizes that an unfortunate result happened simply because of one cause.","うそ を ついた ばかりに しんよう を なくした|Simply because I lied, I lost trust;いそいだ ばかりに まちがえた|Simply because I hurried, I made a mistake;しらなかった ばかりに そん を した|I suffered a loss simply because I did not know"],
["2-58. あまり: so much that","g2","文","Verb dictionary form or noun + の + あまり expresses an extreme degree that causes a result.","うれしさ の あまり なみだ が でた|I was so happy that tears came;しんぱい する あまり ねむれなかった|I was so worried that I could not sleep;いそがしさ の あまり びょうき に なった|I became ill from being too busy"],
["2-59. につき: due to / per","g2","文","Noun + につき is a formal notice expression meaning due to, or a rate expression meaning per.","こうじちゅう に つき つうこう できません|Passage is prohibited due to construction;ひとり に つき にまい まで|Up to two per person;てんけん に つき きゅうぎょう します|We will close due to inspection"],
["2-60. に際して: on the occasion of","g2","文","Noun or verb dictionary form + に際して is a formal expression used for an important occasion or undertaking.","しゅっぱつ に さいして あいさつ が あった|There was a greeting on the occasion of departure;もうしこみ に さいして ひつよう しょるい を だす|Submit the necessary documents when applying;かいしゃ の せつりつ に さいして|On the occasion of establishing a company"],
["2-61. に先駆けて: ahead of","g2","文","Noun + に先駆けて means ahead of or before others, often for a pioneering action.","せかい に さきがけて あたらしい ぎじゅつ を はっぴょう した|They announced the new technology ahead of the world;ほか の くに に さきがけて せいど を みなおした|They revised the system ahead of other countries;はる に さきがけて さくら が さきました|The cherry blossoms bloomed ahead of spring"],
["2-62. を皮切りに: starting with","g2","文","Noun + を皮切りに describes the first event in a series that follows.","とうきょう での こうえん を かわきり に ぜんこく を まわる|Starting with a performance in Tokyo, they will tour the country;この じけん を かわきり に ぎろん が ひろがった|Starting with this incident, the debate spread;いっさつめ を かわきり に シリーズ が はじまった|The series began with the first book"],
["2-63. に至るまで: all the way to","g2","文","Noun + に至るまで emphasizes an extensive range reaching even the stated endpoint.","こども から おとな に いたる まで にんき です|It is popular with everyone from children to adults;さいしょ から さいご に いたる まで おもしろい|It is interesting from beginning to end;こまかい てん に いたる まで かくにん した|I checked everything down to the smallest details"],
["2-64. といった: such as","g2","文","Noun + といった introduces representative examples, often before a general category.","りんご や みかん と いった くだもの|Fruits such as apples and mandarins;じこ や さいがい と いった できごと|Events such as accidents and disasters;えいが や おんがく と いった ぶんか|Culture such as films and music"],
["2-65. にほかならない vs にすぎない","g2","文","にほかならない emphasizes identity or cause; にすぎない deliberately minimizes the value or scope.","せいこう は どりょく の けっか に ほかならない|Success is nothing other than the result of effort;これは ひとつ の れい に すぎない|This is merely one example;かれ の はつげん は じじつ に ほかならない|His statement is nothing other than fact"],
["Directions","k","上 jou|ue up,下 ka|shita down,中 chuu|naka middle,左 sa|hidari left,右 yuu|migi right","Many kanji have a different reading alone than inside words. Learn both: 上 is ue by itself and jou in words like 上手 (jouzu, skilled)."],

function mixedPickUnique(arr,count){
  return shuffle([...new Set(arr.filter(x=>x!==undefined&&x!==null&&String(x).trim()!==''))]).slice(0,count);
}
function mixedGrammarCategory(level){return ({N5:'s',N4:'g4',N3:'g3',N2:'g2'})[level]}
function mixedBuildBanks(level){
  const kanji=KANJI_ALL.filter(k=>k.level===level&&k.ch&&k.meaning);
  const vocab=(VOCAB_FLAT[level]||[]).filter(w=>w.j&&w.meaning&&w.kana);
  const cat=mixedGrammarCategory(level);
  const grammar=D.filter(d=>d[1]===cat&&d[2]==='文'&&d[3]&&d[4]).map((d,i)=>{
    const examples=String(d[4]).split(';').map(pair=>{
      const parts=pair.split('|');
      return {jp:(parts[0]||'').trim(),en:(parts.slice(1).join('|')||'').trim()};
    }).filter(x=>x.jp&&x.en);
    if(!examples.length)return null;
    const ex=examples[Math.floor(Math.random()*examples.length)];
    return {id:'g:'+level+':'+d[0],title:d[0],explanation:d[3],jp:ex.jp,en:ex.en};
  }).filter(Boolean);
  return {kanji,vocab,grammar};
}
function mixedMakeQuestions(level,count){
  const per=count/3,banks=mixedBuildBanks(level);
  if(banks.kanji.length<per||banks.vocab.length<per||banks.grammar.length<per){
    throw new Error(`Not enough ${level} material for ${count} questions.`);
  }
  const chosenK=shuffle(banks.kanji).slice(0,per);
  const chosenV=shuffle(banks.vocab).slice(0,per);
  const chosenG=shuffle(banks.grammar).slice(0,per);
  const questions=[];

  chosenK.forEach((k,i)=>{
    const correct=k.meaning;
    const distractors=mixedPickUnique(banks.kanji.filter(x=>x.id!==k.id).map(x=>x.meaning).filter(x=>x!==correct),3);
    const choices=shuffle([correct,...distractors]);
    if(choices.length!==4)throw new Error('Could not prepare four distinct Kanji choices.');
    questions.push({
      id:'k:'+k.id,subject:'Kanji',prompt:'Choose the correct meaning of this Kanji.',
      content:`<div class="jp" style="font-size:58px;color:var(--pri);font-weight:900;text-align:center">${esc(k.ch)}</div>`,
      correct,choices,
      explanation:`${esc(k.ch)} means ${esc(k.meaning)}. On’yomi: ${esc(k.on||'—')}. Kun’yomi: ${esc(k.kun||'—')}.${k.word?` Example: ${esc(k.word)} (${esc(k.reading||'')}) — ${esc(k.wordMeaning||'')}.`:''}`
    });
  });

  chosenV.forEach(w=>{
    const correct=w.meaning;
    const distractors=mixedPickUnique(banks.vocab.filter(x=>x.id!==w.id).map(x=>x.meaning).filter(x=>x!==correct),3);
    const choices=shuffle([correct,...distractors]);
    if(choices.length!==4)throw new Error('Could not prepare four distinct vocabulary choices.');
    questions.push({
      id:'v:'+w.id,subject:'Vocabulary',prompt:'Choose the correct meaning.',
      content:`<div class="jp" style="font-size:38px;color:var(--pri);font-weight:900;text-align:center">${esc(w.j)}</div><p class="reading" style="text-align:center">${esc(w.kana)} · ${esc(w.romaji)}</p>`,
      correct,choices,
      explanation:`${esc(w.j)} (${esc(w.kana)}, ${esc(w.romaji)}) means ${esc(w.meaning)}. Word type: ${esc(w.type)}. Example: ${esc(w.example)} — ${esc(w.translation)}`
    });
  });

  chosenG.forEach(g=>{
    const correct=g.title;
    const distractors=mixedPickUnique(banks.grammar.filter(x=>x.id!==g.id).map(x=>x.title),3);
    const choices=shuffle([correct,...distractors]);
    if(choices.length!==4)throw new Error('Could not prepare four distinct grammar choices.');
    questions.push({
      id:g.id,subject:'Grammar',prompt:'Which grammar lesson best matches this sentence?',
      content:`<div class="jp" style="font-size:22px;line-height:1.7;text-align:center">${esc(g.jp)}</div><p class="note" style="text-align:center">“${esc(g.en)}”</p>`,
      correct,choices,
      explanation:`${esc(g.title)}: ${esc(g.explanation)} Example: ${esc(g.jp)} — ${esc(g.en)}`
    });
  });
  return shuffle(questions);
}
function mixedQuizStart(){
  try{
    mixedQuizItems=mixedMakeQuestions(mixedLevel,mixedCount);
  }catch(e){
    toast(e&&e.message?e.message:'Could not prepare this quiz. Please try again.');

  mixedQuizIndex=0;mixedQuizScore=0;mixedQuizAnswered=false;mixedQuizChoice=-1;

function mixedQuizShow(){
  if(mixedQuizIndex>=mixedQuizItems.length){mixedQuizFinish();return}
  const q=mixedQuizItems[mixedQuizIndex];
  mixedQuizAnswered=false;mixedQuizChoice=-1;
  mixedQuizRender();
}
function mixedQuizRender(){
  const q=mixedQuizItems[mixedQuizIndex];
  if(!q)return;
  const pct=Math.round(mixedQuizIndex/mixedQuizItems.length*100);
  const optionHtml=q.choices.map((choice,i)=>{
    const cls=mixedQuizAnswered&&choice===q.correct?'opt ok':mixedQuizAnswered&&i===mixedQuizChoice?'opt bad':'opt';
    return `<button class="${cls}" ${mixedQuizAnswered?'disabled':''} onclick="mixedQuizAnswer(${i})">${esc(choice)}</button>`;
  }).join('');
  A.innerHTML=`<header><button class="x" onclick="mixedQuizSetup()" aria-label="Exit quiz">✕</button><span class="logo">${mixedLevel} Mixed Quiz</span><span class="stat">${mixedQuizIndex+1}/${mixedQuizItems.length}</span></header>

    </section>${nav()}`;
}
function mixedQuizAnswer(choiceIndex){
  if(mixedQuizAnswered)return;
  const q=mixedQuizItems[mixedQuizIndex];
  if(!q||!Number.isInteger(choiceIndex)||choiceIndex<0||choiceIndex>=q.choices.length)return;
  mixedQuizAnswered=true;mixedQuizChoice=choiceIndex;
  if(q.choices[choiceIndex]===q.correct){mixedQuizScore++;mixedQuizSubjectScores[q.subject].correct++;}
  mixedQuizRender();
}
function mixedQuizNext(){if(!mixedQuizAnswered)return;mixedQuizIndex++;mixedQuizShow()}
function mixedQuizFinish(){

function mockOptions(correct,pool,backup){
  const options=[...new Set((pool||[]).filter(x=>x!==undefined&&x!==null&&String(x).trim()!==''&&String(x)!==String(correct)).map(String))];
  let distractors=shuffle(options).slice(0,3);
  for(const item of (backup||[])){
    if(distractors.length>=3)break;
    if(String(item)!==String(correct)&&!distractors.includes(String(item)))distractors.push(String(item));
  }
  if(distractors.length<3)throw new Error('The question bank did not contain enough different answer choices.');
  return shuffle([String(correct),...distractors]);
}
function mockMakeVocabulary(level){
  const words=(VOCAB_FLAT[level]||[]).filter(w=>w.j&&w.kana&&w.meaning);
  if(words.length<8)throw new Error('Not enough '+level+' vocabulary data for a mock examination.');
  return shuffle(words).map((w,i)=>{
    let prompt,content,correct,pool;
    if(i%3===0){
      prompt='Choose the correct meaning of this word.';
      content=`<div class="jp" style="font-size:38px;text-align:center;color:var(--pri);font-weight:900">${esc(w.j)}</div><p class="note" style="text-align:center">${esc(w.kana)}</p>`;
      correct=w.meaning;pool=words.map(x=>x.meaning);

      content=`<div class="jp" style="font-size:42px;text-align:center;color:var(--pri);font-weight:900">${esc(w.j)}</div>`;

      correct=w.j;pool=words.map(x=>x.j);
